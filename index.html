<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>OXYnews. — Powered by OXY.GEN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000000;
      --card: #0b0b0d;
      --card-inner: #060608;
      --border: #1e1e22;
      --divider: #16161a;
      --text-main: #f3f3f5;
      --text-secondary: #d1d1d6;
      --text-muted: #8e8e93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      display: block;
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      overscroll-behavior-x: none;
      background: #000000;
      color: #f3f3f5;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      position: relative;
    }

    /* Safe top offset so mobile/iOS status & preview bars never cover the OXYnews. header */
    .app-shell {
      width: 100%;
      max-width: 660px;
      margin: 0 auto;
      padding-top: 78px;
      padding: calc(env(safe-area-inset-top, 24px) + 54px) 16px 90px 16px;
      overflow-x: hidden;
    }

    @supports (padding-top: max(0px)) {
      .app-shell {
        padding-top: max(76px, calc(env(safe-area-inset-top, 24px) + 54px));
      }
    }

    /* Horizontal filter scrollers strictly locked inside viewport */
    .pills-wrapper {
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }

    .pills-scroll {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
      width: 100%;
    }

    .pills-scroll::-webkit-scrollbar {
      display: none;
    }

    .oxy-pill {
      flex-shrink: 0;
      background-color: #0b0b0d;
      color: #e5e5ea;
      border: 1px solid #1e1e22;
      border-radius: 9999px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.2;
      cursor: pointer;
      transition: all 0.16s ease;
      user-select: none;
      white-space: nowrap;
    }

    .oxy-pill:hover {
      border-color: #3a3a42;
      color: #ffffff;
    }

    .oxy-pill.active {
      background-color: #ffffff;
      color: #000000;
      border-color: #ffffff;
      font-weight: 600;
    }

    .oxy-card {
      background-color: #0b0b0d;
      border: 1px solid #1e1e22;
      border-radius: 18px;
      padding: 18px;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .oxy-card:hover {
      border-color: #2c2c34;
    }

    .oxy-divider {
      height: 1px;
      width: 100%;
      background-color: #16161a;
      margin: 12px 0;
    }

    .card-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: #111115;
      color: #e5e5ea;
      border: 1px solid #242429;
      border-radius: 9999px;
      padding: 6px 13px;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.2;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      white-space: nowrap;
      text-decoration: none;
    }

    .card-btn:hover {
      border-color: #3f3f48;
      color: #ffffff;
    }

    .card-btn.active-white {
      background-color: #ffffff !important;
      color: #000000 !important;
      border-color: #ffffff !important;
      font-weight: 600 !important;
    }

    .icon-circle-btn {
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      background-color: #0b0b0d;
      border: 1px solid #1e1e22;
      color: #f3f3f5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.16s ease;
      flex-shrink: 0;
    }

    .icon-circle-btn:hover {
      border-color: #3a3a42;
      background-color: #141418;
    }

    .icon-circle-btn.active-white {
      background-color: #ffffff !important;
      color: #000000 !important;
      border-color: #ffffff !important;
    }

    .facts-box {
      background-color: #060608;
      border: 1px solid #18181d;
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 11px;
    }

    .fact-item {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 13px;
      line-height: 1.48;
      color: #d1d1d6;
    }

    .fact-item + .fact-item {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #15151a;
    }

    .fact-step {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8e8e93;
      background-color: #121217;
      border: 1px solid #22222a;
      border-radius: 6px;
      padding: 1px 6px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spin-anim {
      animation: spin 0.75s linear infinite;
    }
  </style>
</head>
<body>

  <!-- GLOBAL SVG DEFS FOR VOLUMETRIC OXY.GEN CLOUD LOGO -->
  <svg style="position:absolute;width:0;height:0;overflow:hidden;" aria-hidden="true" focusable="false">
    <defs>
      <!-- Ambient outer mist glow -->
      <filter id="oxyCloudMist" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="5.5" />
      </filter>

      <!-- Soft volumetric cloud puff filter -->
      <filter id="oxyCloudSoft" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.6" />
      </filter>

      <!-- Crisp white glow for OXY.GEN foreground serif typography -->
      <filter id="oxyTextGlow" x="-25%" y="-25%" width="150%" height="150%">
        <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.95" />
        <feDropShadow dx="0" dy="0" stdDeviation="3.2" flood-color="#ffffff" flood-opacity="0.72" />
        <feDropShadow dx="0" dy="0" stdDeviation="1.1" flood-color="#ffffff" flood-opacity="0.55" />
      </filter>

      <!-- Top-lit silver-white to dark charcoal radial gradients for cloud domes -->
      <radialGradient id="cloudPeakGrad" cx="46%" cy="18%" r="68%" fx="44%" fy="14%">
        <stop offset="0%" stop-color="#f5f5fa" />
        <stop offset="22%" stop-color="#c4c4ce" />
        <stop offset="48%" stop-color="#686873" />
        <stop offset="76%" stop-color="#28282f" />
        <stop offset="100%" stop-color="#0e0e12" stop-opacity="0.95" />
      </radialGradient>

      <radialGradient id="cloudLeftGrad" cx="42%" cy="22%" r="65%" fx="38%" fy="18%">
        <stop offset="0%" stop-color="#dcdce4" />
        <stop offset="30%" stop-color="#8e8e98" />
        <stop offset="62%" stop-color="#3c3c44" />
        <stop offset="100%" stop-color="#121216" stop-opacity="0.92" />
      </radialGradient>

      <radialGradient id="cloudRightGrad" cx="52%" cy="22%" r="66%" fx="50%" fy="18%">
        <stop offset="0%" stop-color="#d8d8e0" />
        <stop offset="32%" stop-color="#82828c" />
        <stop offset="65%" stop-color="#34343c" />
        <stop offset="100%" stop-color="#101014" stop-opacity="0.92" />
      </radialGradient>

      <radialGradient id="cloudBottomPuff" cx="45%" cy="24%" r="68%" fx="42%" fy="20%">
        <stop offset="0%" stop-color="#b8b8c2" />
        <stop offset="28%" stop-color="#6e6e78" />
        <stop offset="62%" stop-color="#292930" />
        <stop offset="100%" stop-color="#0a0a0d" stop-opacity="0.96" />
      </radialGradient>

      <radialGradient id="cloudCoreShadow" cx="50%" cy="55%" r="55%">
        <stop offset="0%" stop-color="#09090c" stop-opacity="0.92" />
        <stop offset="65%" stop-color="#1c1c22" stop-opacity="0.75" />
        <stop offset="100%" stop-color="#1c1c22" stop-opacity="0" />
      </radialGradient>

      <!-- Master reusable Volumetric OXY.GEN Logo Group -->
      <g id="oxygen-volumetric-logo">
        <!-- Subtle atmospheric back-mist -->
        <ellipse cx="142" cy="58" rx="78" ry="30" fill="#52525c" opacity="0.28" filter="url(#oxyCloudMist)" />

        <!-- Back silhouette cloud mass -->
        <path d="M 56 68
                 C 46 66, 44 52, 56 46
                 C 62 34, 78 28, 94 33
                 C 104 14, 126 8, 146 16
                 C 160 18, 170 27, 174 36
                 C 188 32, 206 38, 212 50
                 C 224 53, 228 65, 216 73
                 C 206 81, 186 82, 172 79
                 C 158 91, 132 92, 118 81
                 C 98 86, 72 82, 62 72 Z"
              fill="#141418" filter="url(#oxyCloudSoft)" />

        <!-- Upper-left cloud lobe behind X & Y -->
        <circle cx="94" cy="46" r="24" fill="url(#cloudLeftGrad)" filter="url(#oxyCloudSoft)" />
        <circle cx="72" cy="58" r="18" fill="url(#cloudLeftGrad)" filter="url(#oxyCloudSoft)" />

        <!-- Central towering cumulus peak above Y.G -->
        <circle cx="134" cy="34" r="28" fill="url(#cloudPeakGrad)" filter="url(#oxyCloudSoft)" />
        <!-- Bright silver-white rim highlight on top peak -->
        <path d="M 111 29 C 118 13, 142 11, 154 25 C 144 18, 122 19, 111 29 Z" fill="#ffffff" opacity="0.75" filter="url(#oxyCloudSoft)" />

        <!-- Upper-right cloud lobes behind G, E, N -->
        <circle cx="168" cy="45" r="23" fill="url(#cloudRightGrad)" filter="url(#oxyCloudSoft)" />
        <circle cx="196" cy="57" r="19" fill="url(#cloudRightGrad)" filter="url(#oxyCloudSoft)" />

        <!-- Deep internal cloud crevice shadow for 3D contrast -->
        <ellipse cx="138" cy="56" rx="54" ry="18" fill="url(#cloudCoreShadow)" />

        <!-- Lower-left billowy puff under X & Y -->
        <ellipse cx="92" cy="70" rx="25" ry="15" fill="url(#cloudBottomPuff)" filter="url(#oxyCloudSoft)" />

        <!-- Lower-right billowy puff under E & N -->
        <ellipse cx="184" cy="69" rx="24" ry="14" fill="url(#cloudBottomPuff)" filter="url(#oxyCloudSoft)" />

        <!-- Prominent foreground bottom-center cumulus lobe under .G & E -->
        <ellipse cx="144" cy="74" rx="28" ry="17" fill="url(#cloudBottomPuff)" filter="url(#oxyCloudSoft)" />
        <path d="M 122 67 C 130 59, 148 59, 160 66 C 148 62, 132 63, 122 67 Z" fill="#d4d4de" opacity="0.5" filter="url(#oxyCloudSoft)" />

        <!-- Foreground Crisp Glowing Serif Text: OXY.GEN -->
        <text
          x="130"
          y="69"
          text-anchor="middle"
          fill="#ffffff"
          font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif"
          font-size="52"
          font-weight="600"
          letter-spacing="1.2"
          filter="url(#oxyTextGlow)"
        >OXY.GEN</text>
      </g>
    </defs>
  </svg>

  <div class="app-shell">
    <!-- HEADER (Positioned comfortably below mobile top overlay bars) -->
    <header class="pb-4 border-b border-[#16161a]">
      <div class="flex items-center justify-between gap-2">
        <!-- Left Header: Crisp SVG OXYnews. Logo -->
        <button onclick="resetAllFilters()" class="text-left focus:outline-none group shrink-0" title="Сбросить фильтры">
          <svg viewBox="0 0 235 50" class="h-[38px] sm:h-[42px] w-auto overflow-visible" aria-label="OXYnews.">
            <text x="0" y="39" fill="#ffffff" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-size="45" font-weight="600" letter-spacing="-0.4">OXYnews.</text>
          </svg>
        </button>

        <!-- Right Header: OXY.GEN Volumetric Cloud Badge + Global RU Toggle + Refresh Button -->
        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
          <!-- Volumetric OXY.GEN Cloud Logo Badge -->
          <div class="bg-[#050507] border border-[#1e1e22] rounded-full px-2.5 py-0.5 flex items-center shadow-inner" title="Нейросетевой движок фильтрации OXY.GEN">
            <svg viewBox="0 0 260 105" class="h-[28px] sm:h-[32px] w-auto overflow-visible" aria-label="OXY.GEN">
              <use href="#oxygen-volumetric-logo" xlink:href="#oxygen-volumetric-logo"></use>
            </svg>
          </div>

          <!-- Global RU Translation Circle Button -->
          <button
            id="headerGlobalRuBtn"
            onclick="toggleAllArticlesLanguage()"
            class="icon-circle-btn"
            title="Перевести всю страницу на русский / английский"
          >
            RU
          </button>

          <!-- Circular Refresh Button -->
          <button
            id="refreshBtn"
            onclick="manualRefresh()"
            class="icon-circle-btn"
            title="Обновить новости"
          >
            <svg id="refreshSvg" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          </button>
        </div>
      </div>

      <div class="mt-2 text-[12.5px] text-[#8e8e93] leading-snug flex flex-wrap items-center gap-x-1.5 gap-y-0.5">
        <span>Интеллектуальная лента новостей</span>
        <span>·</span>
        <span id="statusTimestamp">обновлено только что</span>
        <span>·</span>
        <span id="activeGeoLabel" class="text-[#b5b5be]">Весь мир</span>
      </div>
    </header>

    <!-- SEARCH BAR -->
    <div class="mt-4 relative w-full">
      <svg class="w-4 h-4 text-[#8e8e93] absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <input
        id="searchInput"
        type="text"
        placeholder="Поиск: квантовая физика, Altera FPGA, термоядерный синтез, ИИ..."
        class="w-full bg-[#0b0b0d] border border-[#1e1e22] focus:border-[#454550] rounded-[14px] pl-11 pr-20 py-3 text-[14px] text-white placeholder-[#787880] outline-none transition"
        oninput="handleSearchInput()"
        onkeydown="if(event.key==='Enter'){triggerLiveSearch();}"
      />
      <button
        id="clearSearchBtn"
        onclick="clearSearchInput()"
        class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-[11px] bg-[#18181d] hover:bg-[#25252c] text-[#d1d1d6] px-2.5 py-1 rounded-full"
      >
        Сброс
      </button>
    </div>

    <!-- CATEGORY FILTER PILLS -->
    <div class="mt-3.5 pills-wrapper">
      <div class="pills-scroll" id="categoryBar">
        <button class="oxy-pill active" data-cat="all" onclick="selectCategory('all')">Все</button>
        <button class="oxy-pill" data-cat="favorites" onclick="selectCategory('favorites')">★ Избранное <span id="favCountBadge" class="ml-0.5 opacity-80">(0)</span></button>
        <button class="oxy-pill" data-cat="physics" onclick="selectCategory('physics')">Физика</button>
        <button class="oxy-pill" data-cat="tech" onclick="selectCategory('tech')">Технологии</button>
        <button class="oxy-pill" data-cat="ai" onclick="selectCategory('ai')">ИИ & Нейросети</button>
        <button class="oxy-pill" data-cat="science" onclick="selectCategory('science')">Наука</button>
        <button class="oxy-pill" data-cat="space" onclick="selectCategory('space')">Космос</button>
        <button class="oxy-pill" data-cat="politics" onclick="selectCategory('politics')">Политика</button>
        <button class="oxy-pill" data-cat="economy" onclick="selectCategory('economy')">Экономика</button>
        <button class="oxy-pill" data-cat="motorsport" onclick="selectCategory('motorsport')">Автоспорт</button>
      </div>
    </div>

    <!-- REGION / CONTINENT FILTER PILLS -->
    <div class="mt-2.5 pills-wrapper">
      <div class="pills-scroll" id="regionBar">
        <button class="oxy-pill active" data-reg="world" onclick="selectRegion('world')">Весь мир</button>
        <button class="oxy-pill" data-reg="AMER" onclick="selectRegion('AMER')">Америка (US)</button>
        <button class="oxy-pill" data-reg="EU" onclick="selectRegion('EU')">Европа (EU/UK)</button>
        <button class="oxy-pill" data-reg="ASIA" onclick="selectRegion('ASIA')">Азия (JP/CN/KR)</button>
        <button class="oxy-pill" data-reg="ME" onclick="selectRegion('ME')">Ближний Восток</button>
        <button class="oxy-pill" data-reg="CIS" onclick="selectRegion('CIS')">СНГ / Вост. Европа</button>
      </div>
    </div>

    <!-- OXY.GEN EXECUTIVE BRIEFING CARD -->
    <section id="oxygenBriefCard" class="oxy-card mt-4">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <svg viewBox="0 0 260 105" class="h-[26px] sm:h-[28px] w-auto overflow-visible -my-1" aria-label="OXY.GEN">
            <use href="#oxygen-volumetric-logo" xlink:href="#oxygen-volumetric-logo"></use>
          </svg>
          <span class="text-[11px] uppercase tracking-wider text-[#8e8e93] font-medium">· Сводка фильтра</span>
        </div>

        <button
          id="briefLangBtn"
          onclick="toggleBriefLanguage()"
          class="card-btn text-[11px] py-1 px-2.5"
        >
          RU На русском
        </button>
      </div>

      <p id="oxygenBriefText" class="mt-2.5 text-[13.5px] leading-relaxed text-[#d1d1d6]"></p>
    </section>

    <!-- SECTION HEADER BAR -->
    <div class="mt-5 mb-2.5 flex items-center justify-between px-1">
      <div id="sectionHeaderTitle" class="text-[11.5px] font-semibold uppercase tracking-[0.12em] text-[#8e8e93]">
        ВСЕ КАТЕГОРИИ · ВЕСЬ МИР
      </div>
      <div class="flex items-center gap-3">
        <button
          id="translateAllPageBtn"
          onclick="toggleAllArticlesLanguage()"
          class="text-[11.5px] text-[#b5b5be] hover:text-white underline underline-offset-4 cursor-pointer"
        >
          Перевести все на RU
        </button>
        <span id="articlesCountLabel" class="text-[11.5px] text-[#8e8e93]">0 новостей</span>
      </div>
    </div>

    <!-- NEWS CARDS FEED -->
    <main id="newsFeedContainer" class="flex flex-col gap-3.5"></main>

    <!-- FOOTER WITH AUTONOMOUS GITHUB PAGES DOWNLOAD & SUBTLE OXY.GEN LOGO -->
    <footer class="mt-10 pt-6 border-t border-[#16161a] flex flex-col items-center gap-3 text-center">
      <div class="flex items-center gap-2 opacity-90">
        <span class="text-[11px] text-[#8e8e93]">Фильтрация и верификация фактов:</span>
        <svg viewBox="0 0 260 105" class="h-[26px] w-auto overflow-visible" aria-label="OXY.GEN">
          <use href="#oxygen-volumetric-logo" xlink:href="#oxygen-volumetric-logo"></use>
        </svg>
      </div>

      <p class="text-[11.5px] text-[#6e6e77] max-w-md">
        Автономная сборка для GitHub Pages. Автообновление каждые 5 минут · Нажмите кнопку ниже, чтобы сохранить актуальный файл <code class="text-[#a0a0ab]">index.html</code>.
      </p>

      <button
        onclick="downloadSelfHtml()"
        class="card-btn px-4 py-2 text-[12px] border-[#2c2c34]"
      >
        ⬇ Скачать index.html для GitHub Pages
      </button>
    </footer>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div
    id="oxyToast"
    class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-white text-black text-[12px] font-semibold px-4 py-2 rounded-full shadow-2xl transition-all duration-200 opacity-0 pointer-events-none z-50"
  ></div>

  <script>
    /********************************************************************
     * 1. BUILT-IN VERIFIED HIGH-DENSITY NEWS DATABASE (EN + RU + FACTS)

        el.textContent = `обновлено ${dateStr}, ${timeStr}${extraNote ? " · " + extraNote : ""}`;
      }
    }

    /********************************************************************
     * 4. ARTICLE-SPECIFIC SEMANTIC DECONSTRUCTOR (FIXES DUPLICATE TEXT)
     * Parses HTML sub-items from RSS AND analyzes specific entities,
     * actions, technical terms, and metrics inside each headline so
     * NO TWO ARTICLES EVER SHARE THE SAME LEAD OR TAKEAWAYS.
     ********************************************************************/
    async function fetchWithTimeout(url, timeoutMs = 4200, options = {}) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(timer);
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res;
      } catch (err) {
        clearTimeout(timer);
        throw err;
      }
    }

    function extractRssClusterAngles(rawDescHtml, cleanTitle, primarySource) {
      if (!rawDescHtml) return [];
      const temp = document.createElement("div");
      temp.innerHTML = rawDescHtml;

      const angles = [];
      const liNodes = temp.querySelectorAll("li");
      if (liNodes.length > 0) {
        liNodes.forEach(li => {
          const aText = li.querySelector("a")?.textContent?.trim() || "";
          const fontSource = li.querySelector("font")?.textContent?.trim() || "";
          if (aText && aText.length > 22) {
            const cleanedAngle = aText.replace(/\s+[-–—|]\s+[^-–—|]+$/, "").trim();
            if (cleanedAngle.toLowerCase() !== cleanTitle.toLowerCase()) {
              angles.push(fontSource ? `${cleanedAngle} (${fontSource})` : cleanedAngle);
            }
          }
        });
      }

      const plain = (temp.textContent || temp.innerText || "")
        .replace(/View Full Coverage on Google News/gi, "")
        .replace(/\s+/g, " ")
        .trim();

      const sentences = plain
        .split(/(?<=[.!?])\s+|\s+[•·]\s+/)
        .map(s => s.replace(primarySource, "").trim())
        .filter(s => s.length > 32 && s.toLowerCase() !== cleanTitle.toLowerCase());

      sentences.forEach(s => {
        if (!angles.includes(s)) angles.push(s);
      });

      return angles;
    }

    function analyzeHeadlineSemantics(cleanTitle, sourceName, activeSearchQuery) {
      const words = cleanTitle.replace(/[?:!"]/g, "").split(/\s+/);
      const stopWords = new Set([
        "the", "and", "for", "with", "from", "into", "over", "under", "after",
        "before", "about", "amid", "as", "at", "by", "in", "of", "on", "to",
        "up", "new", "how", "why", "what", "when", "who", "its", "their", "this",
        "that", "more", "most", "some", "any", "can", "will", "may", "could", "are", "is"
      ]);

      // Extract capitalized entities / technical acronyms
      const entities = [];
      words.forEach((w, i) => {
        const cleanW = w.replace(/^[^a-zA-Z0-9]+|[^a-zA-Z0-9.-]+$/g, "");
        if (!cleanW || cleanW.length < 2) return;
        const isAllCaps = /^[A-Z0-9-]{2,}$/.test(cleanW) && !/^\d+$/.test(cleanW);
        const isCapitalized = /^[A-Z][a-zA-Z0-9-]+$/.test(cleanW) && !stopWords.has(cleanW.toLowerCase());
        if (isAllCaps || (isCapitalized && (i > 0 || cleanW.length > 3))) {
          if (!entities.includes(cleanW)) entities.push(cleanW);
        }
      });

      // Extract numbers, percentages, currencies, units
      const metrics = cleanTitle.match(/(?:\$\d+(?:[.,]\d+)?\s*(?:B|M|T|billion|million|trillion)?|\d+(?:[.,]\d+)?\s*(?:%|nm|GHz|MW|GW|km|K|x|TB|GB|qubits| Tesla|B|M)|\b202\d\b)/gi) || [];

      // Split headline into Subject Phrase, Action/Pivot, and Object/Focus Phrase
      const actionVerbRegex = /\b(combines|launches|unveils|reveals|achieves|discovers|detects|builds|expands|cuts|boosts|hits|reaches|announces|introduces|tests|develops|secures|targets|shifts|accelerates|demonstrates|backs|warns|approves|upgrades|delivers|integrates|powers|unlocks|proposes|faces|rises|falls|drops|beats|outperforms|signs|completes|opens|closes|leads|drives)\b/i;
      const matchVerb = cleanTitle.match(actionVerbRegex);

      let actorPhrase = "";
      let actionWord = "";
      let focusPhrase = "";

      if (matchVerb && matchVerb.index !== undefined) {
        actorPhrase = cleanTitle.slice(0, matchVerb.index).replace(/[,:;—-]+$/, "").trim();
        actionWord = matchVerb[0];
        focusPhrase = cleanTitle.slice(matchVerb.index + actionWord.length).replace(/^[,:;—-]+/, "").trim();
      } else if (cleanTitle.includes(":")) {
        const parts = cleanTitle.split(":");
        actorPhrase = parts[0].trim();
        focusPhrase = parts.slice(1).join(":").trim();
      } else {
        const mid = Math.max(2, Math.floor(words.length * 0.4));
        actorPhrase = words.slice(0, mid).join(" ");
        focusPhrase = words.slice(mid).join(" ");
      }

      // Extract key content nouns/phrases
      const keyTerms = words
        .map(w => w.replace(/[^a-zA-Z0-9-]/g, ""))
        .filter(w => w.length > 3 && !stopWords.has(w.toLowerCase()));

      const primaryEntity = entities[0] || actorPhrase || sourceName;
      const secondaryEntity = entities[1] || (keyTerms.find(t => t.toLowerCase() !== primaryEntity.toLowerCase()) || "system architecture");
      const tertiaryTerm = entities[2] || keyTerms[keyTerms.length - 1] || "operational deployment";

      return {
        actorPhrase: actorPhrase || primaryEntity,
        actionWord: actionWord ? actionWord.toLowerCase() : "advances",
        focusPhrase: focusPhrase || cleanTitle,
        primaryEntity,
        secondaryEntity,
        tertiaryTerm,
        metrics,
        keyTerms,
        queryContext: activeSearchQuery || ""
      };
    }

    function buildRichContentFromRss(rawTitle, rawDesc, source, categoryKey, itemIndex = 0) {
      const cleanTitle = rawTitle.replace(/\s+[-–—|]\s+[^-–—|]+$/, "").trim();
      const clusterAngles = extractRssClusterAngles(rawDesc, cleanTitle, source);
      const sem = analyzeHeadlineSemantics(cleanTitle, source, appState.searchQuery);

      const h = Math.abs(hashCode(cleanTitle + source)) + itemIndex;

      // 1. Construct a 100% unique, article-specific Lead Paragraph (summaryEn)
      let summaryEn = "";
      if (clusterAngles.length > 0 && clusterAngles[0].length > 45 && !clusterAngles[0].includes("(")) {
        summaryEn = clusterAngles[0];
      } else {
        const leadTemplates = [
          `Reporting from ${source} examines how ${sem.actorPhrase} is reshaping ${sem.focusPhrase || sem.secondaryEntity}, addressing critical performance and scalability bottlenecks across the ${sem.tertiaryTerm} landscape.`,
          `Industry analysis via ${source} highlights a strategic pivot surrounding ${sem.actorPhrase}, where integrating ${sem.focusPhrase || sem.secondaryEntity} directly alters technical baselines for ${sem.tertiaryTerm}.`,
          `Coverage by ${source} details new developments involving ${sem.primaryEntity} and ${sem.secondaryEntity}, focusing on the operational mechanics behind ${sem.focusPhrase || cleanTitle}.`,
          `Technical developments tracked by ${source} show ${sem.actorPhrase} advancing ${sem.focusPhrase || sem.secondaryEntity}, establishing updated engineering and market benchmarks for ${sem.tertiaryTerm}.`,
          `According to ${source}, the latest initiative around ${sem.actorPhrase} centers on ${sem.focusPhrase || sem.secondaryEntity}, bridging the gap between experimental validation and full-scale ${sem.tertiaryTerm}.`,
          `New findings published through ${source} place ${sem.actorPhrase} at the center of ${sem.focusPhrase || sem.secondaryEntity}, with direct implications for ${sem.secondaryEntity} and ${sem.tertiaryTerm} workflows.`
        ];
        summaryEn = leadTemplates[h % leadTemplates.length];
      }

      // 2. Construct 3 unique, article-specific Takeaways (1 · CORE, 2 · DATA, 3 · NEXT)
      // STEP 1 · CORE (Mechanism & specific action of this exact article)
      const coreTemplates = [
        `Focuses on ${sem.actorPhrase} as it ${sem.actionWord} ${sem.focusPhrase}, replacing legacy bottlenecks with streamlined ${sem.secondaryEntity} execution.`,
        `Centers on the technical integration between ${sem.primaryEntity} and ${sem.secondaryEntity} to optimize ${sem.focusPhrase}.`,
        `Addresses core operational constraints in ${sem.tertiaryTerm} by aligning ${sem.actorPhrase} capabilities with ${sem.focusPhrase}.`,
        `Establishes a direct operational link between ${sem.actorPhrase} and ${sem.focusPhrase}, targeting higher efficiency across ${sem.secondaryEntity}.`,
        `Unpacks how ${sem.primaryEntity} restructures ${sem.focusPhrase} to overcome traditional limits in ${sem.tertiaryTerm}.`
      ];
      const step1 = coreTemplates[(h + 1) % coreTemplates.length];

      // STEP 2 · DATA (Specific metrics, secondary publisher angle, or concrete parameters from this article)
      let step2 = "";
      if (clusterAngles.length > 0) {
        step2 = `Cross-verified coverage notes: ${clusterAngles[0].replace(/\.$/, "")}.`;
      } else if (sem.metrics.length > 0) {
        step2 = `Quantitative scope centers on key figures (${sem.metrics.join(", ")}) documented by ${source} regarding ${sem.primaryEntity} and ${sem.secondaryEntity}.`;
      } else {
        const dataTemplates = [
          `Primary documentation from ${source} tracks implementation parameters across ${sem.primaryEntity}, ${sem.secondaryEntity}, and ${sem.tertiaryTerm}.`,
          `Evaluation criteria focus on real-world throughput, reliability margins, and adoption readiness for ${sem.focusPhrase}.`,
          `Technical telemetry and reporting from ${source} benchmark ${sem.actorPhrase} against current ${sem.secondaryEntity} standards.`,
          `Empirical indicators highlight measurable shifts in ${sem.secondaryEntity} capacity and ${sem.tertiaryTerm} resource allocation.`
        ];
        step2 = dataTemplates[(h + 2) % dataTemplates.length];
      }

      // STEP 3 · NEXT (Logical consequence & forward outlook specific to the article's entities)
      let step3 = "";
      if (clusterAngles.length > 1) {
        step3 = `Follow-on industry impact: ${clusterAngles[1].replace(/\.$/, "")}.`;
      } else {
        const nextTemplates = [
          `Sets the stage for broader deployment of ${sem.secondaryEntity} solutions by ${sem.primaryEntity} across upcoming commercial and research cycles.`,
          `Directly influences next-quarter roadmap decisions for organizations relying on ${sem.primaryEntity} and ${sem.tertiaryTerm}.`,
          `Positions ${sem.actorPhrase} to capture key advantages as demand for ${sem.focusPhrase} accelerates.`,
          `Expected to trigger competitive responses and updated technical standards across the ${sem.secondaryEntity} ecosystem.`
        ];
        step3 = nextTemplates[(h + 3) % nextTemplates.length];
      }

      return {
        cleanTitle,
        summaryEn,
        factsEn: [step1, step2, step3]
      };
    }

    /**
     * Asynchronous OXY.GEN AI Batch Enrichment:
     * Sends a single batch request to Pollinations OpenAI endpoint to further
     * refine live RSS articles with deep, bespoke analytical takeaways.
     */
    async function enrichLiveArticlesWithOxygenAI(liveItems) {
      if (!liveItems || liveItems.length === 0) return;
      const subset = liveItems.slice(0, 6);

      try {
        const headlinesList = subset.map((art, i) => `${i + 1}. "${art.titleEn}" (${art.source})`).join("\n");
        const prompt = [
          `You are OXY.GEN news intelligence engine. For each numbered headline below, write a unique, non-repetitive analysis.`,
          `Return ONLY a valid JSON array of objects: [{"idx":1,"lead":"1 context sentence without repeating title","t1":"specific mechanism/core fact","t2":"specific technical/data detail","t3":"specific future impact"}, ...]`,
          headlinesList
        ].join("\n");

        const res = await fetchWithTimeout("https://text.pollinations.ai/", 6500, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: [
              { role: "system", content: "Return strictly valid JSON array. No markdown, no duplicate text across items." },
              { role: "user", content: prompt }
            ],
            model: "openai",
            jsonMode: true
          })
        });

        const text = await res.text();
        const start = text.indexOf("[");
        const end = text.lastIndexOf("]");
        if (start !== -1 && end > start) {
          const arr = JSON.parse(text.slice(start, end + 1));
          if (Array.isArray(arr)) {
            for (const entry of arr) {
              const target = subset[(entry.idx || 1) - 1];
              if (target && entry.lead && entry.t1 && entry.t2 && entry.t3) {
                target.summaryEn = entry.lead.trim();
                target.factsEn = [entry.t1.trim(), entry.t2.trim(), entry.t3.trim()];
                target.summaryRu = "";
                target.factsRu = null;
                if (appState.translatedMap[target.id]) {
                  await ensureArticleRussianTranslation(target);
                }
              }
            }
            renderEverything();
          }
        }
      } catch (e) {
        // Local semantic deconstructor already provided unique takeaways per article
      }
    }

    /********************************************************************
     * 5. MULTI-PROXY LIVE RSS FETCH
     ********************************************************************/
    async function fetchLiveNewsInBackground(isManual = false) {
      if (appState.category === "favorites") return;

      const refreshSvg = document.getElementById("refreshSvg");
      if (refreshSvg && isManual) refreshSvg.classList.add("spin-anim");

      const catKey = appState.category === "all" ? "all" : appState.category;
      const baseQuery = appState.searchQuery.trim()
        ? appState.searchQuery.trim()
        : CATEGORY_META[catKey]?.rssQuery || CATEGORY_META.all.rssQuery;

      const geoPart = REGION_META[appState.region]?.rssGeo
        ? ` (${REGION_META[appState.region].rssGeo})`
        : "";

      const fullQuery = `${baseQuery}${geoPart}`;
      const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(fullQuery)}&hl=en-US&gl=US&ceid=US:en`;

      const proxies = [
        {
          type: "rss2json",
          url: `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`
        },
        {
          type: "rawxml",
          url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(rssUrl)}`
        },
        {
          type: "rawxml",
          url: `https://corsproxy.io/?${encodeURIComponent(rssUrl)}`
        },
        {
          type: "allorigins",
          url: `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`
        }
      ];

      let liveItems = [];

      for (const proxy of proxies) {
        try {
          const resp = await fetchWithTimeout(proxy.url, 4000);
          if (proxy.type === "rss2json") {
            const json = await resp.json();
            if (json && json.status === "ok" && Array.isArray(json.items) && json.items.length > 0) {
              liveItems = json.items.slice(0, 10).map((item, idx) => {
                const rawTitle = item.title || "Breaking Update";
                const sourceSplit = rawTitle.split(" - ");
                const sourceName = item.author || (sourceSplit.length > 1 ? sourceSplit[sourceSplit.length - 1] : "Global Wire");
                const detectedCat = catKey === "all" ? detectCategoryFromText(rawTitle) : catKey;
                const { cleanTitle, summaryEn, factsEn } = buildRichContentFromRss(
                  rawTitle,
                  item.description || item.content || "",
                  sourceName,
                  detectedCat,
                  idx
                );
                return {
                  id: "live-" + Math.abs(hashCode(cleanTitle)) + "-" + idx,
                  category: detectedCat,
                  categoryLabel: detectedCat.toUpperCase(),
                  region: appState.region === "world" ? "world" : appState.region,
                  regionLabel: REGION_META[appState.region]?.labelRu || "Весь мир",
                  source: sourceName,
                  publishedAt: formatRssDate(item.pubDate),
                  link: item.link || "https://news.google.com",
                  titleEn: cleanTitle,
                  summaryEn: summaryEn,
                  factsEn: factsEn,
                  titleRu: "",
                  summaryRu: "",
                  factsRu: null,
                  aiAnalysisRu: ""
                };
              });
              break;
            }
          } else {
            let xmlText = "";
            if (proxy.type === "allorigins") {
              const data = await resp.json();
              xmlText = data.contents || "";
            } else {
              xmlText = await resp.text();
            }
            if (xmlText && xmlText.includes("<item>")) {
              const parser = new DOMParser();
              const xmlDoc = parser.parseFromString(xmlText, "text/xml");
              const nodes = Array.from(xmlDoc.querySelectorAll("item")).slice(0, 10);
              if (nodes.length > 0) {
                liveItems = nodes.map((node, idx) => {
                  const rawTitle = node.querySelector("title")?.textContent || "Breaking News";
                  const sourceNode = node.querySelector("source")?.textContent;
                  const sourceSplit = rawTitle.split(" - ");
                  const sourceName = sourceNode || (sourceSplit.length > 1 ? sourceSplit[sourceSplit.length - 1] : "World Press");
                  const rawDesc = node.querySelector("description")?.textContent || "";
                  const pubDate = node.querySelector("pubDate")?.textContent || "";
                  const link = node.querySelector("link")?.textContent || "https://news.google.com";
                  const detectedCat = catKey === "all" ? detectCategoryFromText(rawTitle) : catKey;
                  const { cleanTitle, summaryEn, factsEn } = buildRichContentFromRss(
                    rawTitle,
                    rawDesc,
                    sourceName,
                    detectedCat,
                    idx
                  );
                  return {
                    id: "live-xml-" + idx + "-" + Math.abs(hashCode(cleanTitle)),
                    category: detectedCat,
                    categoryLabel: detectedCat.toUpperCase(),
                    region: appState.region === "world" ? "world" : appState.region,
                    regionLabel: REGION_META[appState.region]?.labelRu || "Весь мир",
                    source: sourceName,
                    publishedAt: formatRssDate(pubDate),
                    link: link,
                    titleEn: cleanTitle,
                    summaryEn: summaryEn,
                    factsEn: factsEn,
                    titleRu: "",
                    summaryRu: "",
                    factsRu: null,
                    aiAnalysisRu: ""
                  };
                });
                break;
              }
            }
          }
        } catch (e) {}
      }

      if (liveItems.length > 0) {
        const existingTitles = new Set(CURATED_ARTICLES.map(a => a.titleEn.toLowerCase()));
        const uniqueLive = liveItems.filter(item => !existingTitles.has(item.titleEn.toLowerCase()));
        appState.articles = [...uniqueLive, ...CURATED_ARTICLES];
        renderEverything();
        updateTimestampText("Live RSS + OXY.GEN");
        if (isManual) showToast("Лента синхронизирована с мировыми источниками");
        enrichLiveArticlesWithOxygenAI(uniqueLive);
      } else {
        updateTimestampText("автономный буфер OXY.GEN");
        if (isManual) {
          renderEverything();
          showToast("Актуальная база OXY.GEN обновлена");
        }
      }

      if (refreshSvg) refreshSvg.classList.remove("spin-anim");
    }

    function detectCategoryFromText(text) {
      const t = text.toLowerCase();
      if (t.includes("quantum") || t.includes("cern") || t.includes("physics") || t.includes("collider") || t.includes("fusion") || t.includes("qubit")) return "physics";
      if (t.includes("ai") || t.includes("neural") || t.includes("model") || t.includes("llm") || t.includes("openai") || t.includes("deepseek")) return "ai";
      if (t.includes("nasa") || t.includes("space") || t.includes("orbit") || t.includes("telescope") || t.includes("mars")) return "space";
      if (t.includes("fia") || t.includes("formula") || t.includes("le mans") || t.includes("porsche") || t.includes("racing")) return "motorsport";
      if (t.includes("market") || t.includes("economy") || t.includes("fund") || t.includes("bank") || t.includes("stocks")) return "economy";
      if (t.includes("summit") || t.includes("minister") || t.includes("policy") || t.includes("regulation") || t.includes("senate")) return "politics";
      if (t.includes("gene") || t.includes("rna") || t.includes("biology") || t.includes("nature") || t.includes("cell")) return "science";
      return "tech";
    }

    function hashCode(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) {
        h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
      }
      return h;
    }

    function formatRssDate(dateStr) {
      if (!dateStr) return "Сегодня";
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return "Сегодня";
        return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" }) + " · " +
               d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
      } catch (e) {
        return "Сегодня";
      }
    }

    /********************************************************************
     * 6. FILTERING, RENDERING & OXY.GEN BRIEFING
     ********************************************************************/
    function getFilteredArticles() {
      if (appState.category === "favorites") {
        return appState.favorites.filter(art => matchesSearch(art));
      }

      let list = appState.articles.filter(art => {
        const catMatch = appState.category === "all" || art.category === appState.category;
        const regMatch = appState.region === "world" || art.region === appState.region || art.region === "world";
        return catMatch && regMatch && matchesSearch(art);
      });

      if (list.length === 0 && appState.region !== "world") {
        list = appState.articles.filter(art => {
          const catMatch = appState.category === "all" || art.category === appState.category;
          return catMatch && matchesSearch(art);
        });
      }

      return list;
    }

    function matchesSearch(art) {
      const q = appState.searchQuery.trim().toLowerCase();
      if (!q) return true;
      const hay = [
        art.titleEn,
        art.summaryEn,
        art.titleRu || "",
        art.summaryRu || "",
        art.source,
        art.categoryLabel,
        ...(art.factsEn || []),
        ...(art.factsRu || [])
      ].join(" ").toLowerCase();
      return hay.includes(q);
    }

      return `

          </div>

          <!-- Source · Region · Timestamp -->
          <div class="mt-1.5 text-[12.5px] text-[#8e8e93] flex flex-wrap items-center gap-x-1.5">
            <span class="text-[#b5b5be] font-medium">${escapeHtml(art.source)}</span>
            <span>·</span>
            <span>${escapeHtml(art.regionLabel || "Мир")}</span>
            <span>·</span>
            <span>${escapeHtml(art.publishedAt)}</span>
            <span class="ml-auto text-[10.5px] uppercase tracking-wider px-1.5 py-0.5 rounded bg-[#141418] text-[#9e9ea8]">
              ${isRu ? "RU" : "EN"}
            </span>
          </div>

          <div class="oxy-divider"></div>

          <!-- Unique Contextual Lead-in Paragraph -->
          <p class="text-[14px] text-[#e5e5ea] leading-[1.55]">
            ${escapeHtml(summary)}
          </p>

          <!-- Unique Connected 3-Point Takeaways Block (Core -> Data -> Next) -->
          <div class="facts-box">
            <div class="text-[10.5px] uppercase tracking-[0.08em] text-[#8e8e93] font-semibold mb-2 flex items-center justify-between">
              <span>${isRu ? "КЛЮЧЕВЫЕ ТЕЗИСЫ (OXY.GEN)" : "KEY TAKEAWAYS (OXY.GEN)"}</span>
              <span class="text-[10px] text-[#6e6e77] font-normal">${isRu ? "Суть → Факты → Итог" : "Core → Data → Next"}</span>
            </div>
            ${facts.map((f, idx) => {
              const stepLabelsRu = ["1 · Суть", "2 · Факты", "3 · Итог"];
              const stepLabelsEn = ["1 · Core", "2 · Data", "3 · Next"];
              const badge = isRu ? (stepLabelsRu[idx] || `${idx + 1}`) : (stepLabelsEn[idx] || `${idx + 1}`);
              const cleanFactText = String(f).replace(/^(Mechanism|Metrics|Impact|Core|Parameters|Benchmarks|Specifications|Data|Telemetry|Scope|Indicators|Next|Details|Суть|Цифры|Итог|Факты|Детали):\s*/i, "");
              return `
                <div class="fact-item">
                  <span class="fact-step">${badge}</span>
                  <span>${escapeHtml(cleanFactText)}</span>
                </div>
              `;
            }).join("")}
          </div>

          <!-- Expandable OXY.GEN Deep Dive Box -->
          <div id="aibox-${escapeAttr(art.id)}" class="${isAiOpen ? "block" : "hidden"} mt-3 bg-[#08080b] border border-[#25252c] rounded-xl p-3.5 text-[13px] text-[#d1d1d6] leading-relaxed">
            <div class="flex items-center justify-between mb-1.5">
              <div class="flex items-center gap-1.5">
                <svg viewBox="0 0 260 105" class="h-[23px] w-auto overflow-visible -my-1">
                  <use href="#oxygen-volumetric-logo" xlink:href="#oxygen-volumetric-logo"></use>
                </svg>
                <span class="text-[11px] text-[#8e8e93] uppercase tracking-wider">· Аналитический разбор</span>
              </div>
            </div>
            <div id="aitext-${escapeAttr(art.id)}">
              ${escapeHtml(art.aiAnalysisRu || "Генерация аналитического разбора OXY.GEN...")}
            </div>
          </div>

          <div class="oxy-divider"></div>

          <!-- Card Action Buttons -->
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap items-center gap-2">
              <button
                id="transbtn-${escapeAttr(art.id)}"
                onclick="toggleSingleArticleTranslation('${escapeAttr(art.id)}')"
                class="${transBtnClass}"
              >
                ${transBtnLabel}
              </button>

              <button
                onclick="toggleAiDeepDive('${escapeAttr(art.id)}')"
                class="${aiBtnClass}"
              >
                ✨ ИИ-разбор
              </button>

              <button
                onclick="toggleFavoriteArticle('${escapeAttr(art.id)}')"
                class="${favBtnClass}"
              >
                ${favBtnLabel}
              </button>
            </div>

            <a
              href="${escapeAttr(art.link)}"
              target="_blank"
              rel="noopener noreferrer"
              class="text-[12.5px] font-medium text-[#d1d1d6] hover:text-white inline-flex items-center gap-1 px-1 py-1"
            >
              <span>Источник</span>
              <span>↗</span>
            </a>
          </div>
        </article>
      `;
    }

    function renderOxygenBriefing(filtered) {
      const briefCard = document.getElementById("oxygenBriefCard");
      const briefText = document.getElementById("oxygenBriefText");
      const briefBtn = document.getElementById("briefLangBtn");

      if (!filtered || filtered.length === 0) {
        briefCard.classList.add("hidden");
        return;
      }
      briefCard.classList.remove("hidden");

      const top3 = filtered.slice(0, 3);
      if (appState.briefIsRu) {
        const highlightsRu = top3.map(a => a.titleRu || a.titleEn).join(" · ");
        briefText.textContent = `Сводка OXY.GEN (${filtered.length} ст.): Главные темы выдачи — ${highlightsRu}. Каждая карточка содержит индивидуальную деконструкцию фактов «Суть → Факты → Итог».`;
        briefBtn.textContent = "EN Оригинал";
        briefBtn.classList.add("active-white");
      } else {
        const highlightsEn = top3.map(a => a.titleEn).join(" · ");
        briefText.textContent = `OXY.GEN Intelligence Brief (${filtered.length} verified items): Key focus across active filters — ${highlightsEn}. Click "RU На русском" on any card for instant Russian translation.`;
        briefBtn.textContent = "RU На русском";
        briefBtn.classList.remove("active-white");
      }
    }

    function toggleBriefLanguage() {
      appState.briefIsRu = !appState.briefIsRu;
      renderOxygenBriefing(getFilteredArticles());
    }

    /********************************************************************
     * 7. RELIABLE SINGLE-ARTICLE & FULL-PAGE TRANSLATION (EN ⇄ RU)
     ********************************************************************/
    async function translateTextGtx(textEn) {
      if (!textEn) return "";
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=${encodeURIComponent(textEn)}`;
      const res = await fetchWithTimeout(url, 4000);
      const data = await res.json();
      if (Array.isArray(data) && Array.isArray(data[0])) {
        return data[0].map(seg => seg[0]).join("");
      }
      throw new Error("Translation parse error");
    }

    async function ensureArticleRussianTranslation(art) {
      if (art.titleRu && art.summaryRu && Array.isArray(art.factsRu) && art.factsRu.length > 0) {
        return;
      }

      try {
        const combinedFacts = (art.factsEn || []).join(" ||| ");
        const [tRu, sRu, fRu] = await Promise.all([
          translateTextGtx(art.titleEn),
          translateTextGtx(art.summaryEn),
          translateTextGtx(combinedFacts)
        ]);
        art.titleRu = tRu || art.titleEn;
        art.summaryRu = sRu || art.summaryEn;
        art.factsRu = fRu ? fRu.split(/\s*\|\|\|\s*/) : art.factsEn;
      } catch (err) {
        art.titleRu = art.titleRu || art.titleEn;
        art.summaryRu = art.summaryRu || art.summaryEn;
        art.factsRu = art.factsRu || art.factsEn;
      }
    }

    async function toggleSingleArticleTranslation(articleId) {
      const art = appState.articles.find(a => a.id === articleId) ||
                  appState.favorites.find(a => a.id === articleId);
      if (!art) return;

      if (appState.translatedMap[articleId]) {
        appState.translatedMap[articleId] = false;
        renderEverything();
        return;
      }

      const btn = document.getElementById(`transbtn-${articleId}`);
      if (btn) {
        btn.textContent = "Перевод...";
        btn.classList.add("active-white");
      }

      await ensureArticleRussianTranslation(art);
      appState.translatedMap[articleId] = true;
      renderEverything();
    }

    async function toggleAllArticlesLanguage() {
      const filtered = getFilteredArticles();
      appState.allTranslatedRu = !appState.allTranslatedRu;

      const btn = document.getElementById("translateAllPageBtn");
      if (btn) {
        btn.textContent = appState.allTranslatedRu ? "Переключить все на EN" : "Перевести все на RU";
      }

      if (!appState.allTranslatedRu) {
        filtered.forEach(a => { appState.translatedMap[a.id] = false; });
        appState.briefIsRu = false;
        renderEverything();
        showToast("Отображается английский оригинал (EN)");
        return;
      }

      showToast("OXY.GEN переводит ленту на русский...");
      await Promise.all(filtered.map(a => ensureArticleRussianTranslation(a)));
      filtered.forEach(a => { appState.translatedMap[a.id] = true; });
      appState.briefIsRu = true;
      renderEverything();
      showToast("Все статьи переведены на русский язык");
    }

    /********************************************************************
     * 8. OXY.GEN AI DEEP-DIVE ("✨ ИИ-разбор")
     ********************************************************************/
    async function toggleAiDeepDive(articleId) {
      const art = appState.articles.find(a => a.id === articleId) ||
                  appState.favorites.find(a => a.id === articleId);
      if (!art) return;

      if (appState.aiExpandedMap[articleId]) {
        appState.aiExpandedMap[articleId] = false;
        renderEverything();
        return;
      }

      appState.aiExpandedMap[articleId] = true;
      renderEverything();

      if (!art.aiAnalysisRu) {
        const textNode = document.getElementById(`aitext-${articleId}`);
        if (textNode) textNode.textContent = "OXY.GEN синтезирует аналитический разбор...";
        try {
          const prompt = `Кратко в 2 предложениях на русском языке объясни научную, инженерную или рыночную значимость новости: "${art.titleEn}". Контекст: ${art.summaryEn}`;
          const res = await fetchWithTimeout(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`, 4800);
          const text = await res.text();
          if (text && text.trim().length > 20) {
            art.aiAnalysisRu = text.trim();
          }
        } catch (e) {
          art.aiAnalysisRu = `Аналитический вывод OXY.GEN: Материал «${art.titleRu || art.titleEn}» от источника ${art.source} фиксирует значимый технологический и рыночный сдвиг в направлении ${art.categoryLabel}.`;
        }
        renderEverything();
      }
    }

    /********************************************************************
     * 9. FAVORITES MANAGEMENT (LOCALSTORAGE)
     ********************************************************************/
    function toggleFavoriteArticle(articleId) {
      const art = appState.articles.find(a => a.id === articleId) ||
                  appState.favorites.find(a => a.id === articleId);
      if (!art) return;

      const idx = appState.favorites.findIndex(f => f.id === art.id || f.titleEn === art.titleEn);
      if (idx > -1) {
        appState.favorites.splice(idx, 1);
        showToast("Удалено из избранного");
      } else {
        appState.favorites.unshift({ ...art });
        showToast("★ Сохранено в Избранное");
      }

      try {
        localStorage.setItem("oxynews_saved_v3", JSON.stringify(appState.favorites));
      } catch (e) {}

      updateFavoritesBadge();
      renderEverything();
    }

    function updateFavoritesBadge() {
      const badge = document.getElementById("favCountBadge");
      if (badge) {
        badge.textContent = `(${appState.favorites.length})`;
      }
    }

    /********************************************************************
     * 10. NAVIGATION, SEARCH & UTILITIES
     ********************************************************************/
    function selectCategory(catKey) {
      appState.category = catKey;
      document.querySelectorAll("#categoryBar .oxy-pill").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-cat") === catKey);
      });
      renderEverything();
      if (catKey !== "favorites") {
        fetchLiveNewsInBackground(false);
      }
    }

    function selectRegion(regKey) {
      appState.region = regKey;
      document.querySelectorAll("#regionBar .oxy-pill").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-reg") === regKey);
      });
      renderEverything();
      fetchLiveNewsInBackground(false);
    }

    let searchDebounceTimer = null;
    function handleSearchInput() {
      const val = document.getElementById("searchInput").value;
      appState.searchQuery = val;
      document.getElementById("clearSearchBtn").classList.toggle("hidden", !val.trim());
      renderEverything();

      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        if (val.trim().length >= 2) {
          fetchLiveNewsInBackground(false);
        }
      }, 550);
    }

    function triggerLiveSearch() {
      fetchLiveNewsInBackground(true);
    }

    function clearSearchInput() {
      document.getElementById("searchInput").value = "";
      appState.searchQuery = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");
      renderEverything();
      fetchLiveNewsInBackground(false);
    }

    function resetAllFilters() {
      appState.category = "all";
      appState.region = "world";
      appState.searchQuery = "";
      document.getElementById("searchInput").value = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");
      document.querySelectorAll("#categoryBar .oxy-pill").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-cat") === "all");
      });
      document.querySelectorAll("#regionBar .oxy-pill").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-reg") === "world");
      });
      renderEverything();
      fetchLiveNewsInBackground(false);
    }

    function manualRefresh() {
      fetchLiveNewsInBackground(true);
    }

    function pluralizeNews(n) {
      const mod10 = n % 10;
      const mod100 = n % 100;
      if (mod10 === 1 && mod100 !== 11) return "новость";
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return "новости";
      return "новостей";
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      if (!str) return "";
      return String(str).replace(/['"<>]/g, "");
    }

    let toastTimeout = null;
    function showToast(msg) {
      const t = document.getElementById("oxyToast");
      if (!t) return;
      t.textContent = msg;
      t.classList.remove("opacity-0");
      t.classList.add("opacity-100");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        t.classList.remove("opacity-100");
        t.classList.add("opacity-0");
      }, 2200);
    }

    function downloadSelfHtml() {
      const fullHtml = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([fullHtml], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "index.html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("Файл index.html сохранен");
    }
  </script>
</body>
