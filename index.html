<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>OXYnews. — Powered by OXY.GEN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000000;
      --card: #0b0b0d;
      --card-inner: #060608;
      --border: #1e1e22;
      --divider: #16161a;
      --text-main: #f3f3f5;
      --text-secondary: #d1d1d6;
      --text-muted: #8e8e93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      display: block;
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      overscroll-behavior-x: none;
      background: #000000;
      color: #f3f3f5;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      position: relative;
    }

    /* Safe top offset so mobile/iOS status & preview bars never cover the OXYnews. header */
    .app-shell {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding-top: 78px;
      padding: calc(env(safe-area-inset-top, 24px) + 54px) 16px 90px 16px;
      overflow-x: hidden;
    }

    @supports (padding-top: max(0px)) {
      .app-shell {
        padding-top: max(76px, calc(env(safe-area-inset-top, 24px) + 54px));
      }
    }

    /* Horizontal filter scrollers strictly locked inside viewport */
    .pills-wrapper {
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }

    .pills-scroll {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
      width: 100%;
    }

    .pills-scroll::-webkit-scrollbar {
      display: none;
    }

    .oxy-pill {
      flex-shrink: 0;
      background-color: #0b0b0d;
      color: #e5e5ea;
      border: 1px solid #1e1e22;
      border-radius: 9999px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.2;
      cursor: pointer;
      transition: all 0.16s ease;
      user-select: none;
      white-space: nowrap;
    }

    .oxy-pill:hover {
      border-color: #3a3a42;
      color: #ffffff;
    }

    .oxy-pill.active {
      background-color: #ffffff;
      color: #000000;
      border-color: #ffffff;
      font-weight: 600;
    }

    .oxy-card {
      background-color: #0b0b0d;
      border: 1px solid #1e1e22;
      border-radius: 18px;
      padding: 18px;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .oxy-card:hover {
      border-color: #2c2c34;
    }

    .oxy-divider {
      height: 1px;
      width: 100%;
      background-color: #16161a;
      margin: 12px 0;
    }

    .card-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: #111115;
      color: #e5e5ea;
      border: 1px solid #242429;
      border-radius: 9999px;
      padding: 6px 13px;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.2;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      white-space: nowrap;
      text-decoration: none;
    }

    .card-btn:hover {
      border-color: #3f3f48;
      color: #ffffff;
    }

    .card-btn.active-white {
      background-color: #ffffff !important;
      color: #000000 !important;
      border-color: #ffffff !important;
      font-weight: 600 !important;
    }

    .icon-circle-btn {
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      background-color: #0b0b0d;
      border: 1px solid #1e1e22;
      color: #f3f3f5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.16s ease;
      flex-shrink: 0;
    }

    .icon-circle-btn:hover {
      border-color: #3a3a42;
      background-color: #141418;
    }

    .icon-circle-btn.active-white {
      background-color: #ffffff !important;
      color: #000000 !important;
      border-color: #ffffff !important;
    }

    .facts-box {
      background-color: #060608;
      border: 1px solid #18181d;
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 11px;
    }

    .fact-item {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 13px;
      line-height: 1.48;
      color: #d1d1d6;
    }

    .fact-item + .fact-item {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #15151a;
    }

    .fact-step {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8e8e93;
      background-color: #121217;
      border: 1px solid #22222a;
      border-radius: 6px;
      padding: 1px 6px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spin-anim {
      animation: spin 0.75s linear infinite;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <!-- HEADER -->
    <header class="pb-4 border-b border-[#16161a]">
      <div class="flex items-center justify-between gap-2">
        <!-- Left Header: Crisp SVG OXYnews. Logo -->
        <button onclick="resetAllFilters()" class="text-left focus:outline-none group shrink-0" title="Сбросить фильтры">
          <svg viewBox="0 0 235 50" class="h-[38px] sm:h-[42px] w-auto overflow-visible" aria-label="OXYnews.">

          <button

            title="Перевести всю страницу на русский / английский"

            RU
          </button>

          <button
            id="refreshBtn"
            onclick="manualRefresh()"
            class="icon-circle-btn"
            title="Обновить новости"
          >
            <svg id="refreshSvg" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />

      <div class="mt-2 text-[12.5px] text-[#8e8e93] leading-snug flex flex-wrap items-center gap-x-1.5 gap-y-0.5">

    async function fetchWithTimeout(url, timeoutMs = 4500, options = {}) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(timer);
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res;
      } catch (err) {
        clearTimeout(timer);
        throw err;
      }
    }

    function hasCyrillic(str) {
      return /[а-яА-ЯёЁ]/.test(str || "");

    // Filters out classified ads, gun broker listings, eBay/shopping spam
    function isShoppingOrClassifiedSpam(title, source = "") {
      const combined = `${title} ${source}`.toLowerCase();
      return /\b(for sale|used\s*-\s*good condition|good condition|buy now|in stock|free shipping|price list|coupon code|discount code|classifieds|ebay|craigslist|guns\.com|gunbroker|autotrader|shopping)\b/i.test(combined);

    // Resolves any user query (RU or EN) into both { enQuery, ruQuery, isRuInput }
    async function resolveBilingualQueryPair(rawQuery) {
      const clean = (rawQuery || "").trim();
      if (!clean) return { enQuery: "", ruQuery: "", isRuInput: false };

      const lower = clean.toLowerCase();
      const isRuInput = hasCyrillic(clean);

      if (BILINGUAL_QUERY_MAP[lower]) {
        return {
          enQuery: BILINGUAL_QUERY_MAP[lower].en,
          ruQuery: BILINGUAL_QUERY_MAP[lower].ru,
          isRuInput
        };
      }

      try {
        if (isRuInput) {
          const enTranslated = await translateTextPair(clean, "ru", "en");
          return {
            enQuery: enTranslated || transliterateRuToEn(clean),
            ruQuery: clean,
            isRuInput: true
          };
        } else {
          const ruTranslated = await translateTextPair(clean, "en", "ru");
          return {
            enQuery: clean,
            ruQuery: ruTranslated || clean,
            isRuInput: false
          };
        }
      } catch (e) {
        return {
          enQuery: isRuInput ? transliterateRuToEn(clean) : clean,
          ruQuery: clean,
          isRuInput
        };
      }
    }

    function transliterateRuToEn(text) {
      const map = {
        а:"a", б:"b", в:"v", г:"g", д:"d", е:"e", ё:"e", ж:"zh", з:"z", и:"i", й:"y",
        к:"k", л:"l", м:"m", н:"n", о:"o", п:"p", р:"r", с:"s", т:"t", у:"u", ф:"f",
        х:"kh", ц:"ts", ч:"ch", ш:"sh", щ:"shch", ъ:"", ы:"y", ь:"", э:"e", ю:"yu", я:"ya"
      };
      return String(text || "").split("").map(ch => {
        const low = ch.toLowerCase();
        if (map[low] !== undefined) {
          const tr = map[low];
          return ch === low ? tr : tr.charAt(0).toUpperCase() + tr.slice(1);
        }
        return ch;
      }).join("");
    }

    async function translateTextPair(text, sl = "en", tl = "ru") {
      if (!text) return "";
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
      const res = await fetchWithTimeout(url, 3600);
      const data = await res.json();
      if (Array.isArray(data) && Array.isArray(data[0])) {
        return data[0].map(seg => seg[0]).join("");
      }
      return text;
    }

    function stripJournalisticFiller(title) {
      if (!title) return "";
      return title
        .replace(/\s+[-–—|]\s+[^-–—|]+$/, "")
        .replace(/,\s*(?:a\s+)?(?:new\s+)?(?:report|study|survey|analysis|source|sources|officials|experts|analysts|insiders|filing|document)s?\s+(?:says?|shows?|reveals?|claims?|suggests?|finds?|indicates?|warns?|confirms?|notes?)\b.*$/i, "")
        .replace(/\b(?:report|reports|sources|officials|analysts)\s+(?:say|says|claim|claims|reveal|reveals|warn|warns)\s*:?\s*/gi, "")
        .replace(/\b(?:according to\s+(?:a\s+)?(?:new\s+)?(?:report|study|sources|officials|analysts))\b/gi, "")
        .replace(/\s*[—–-]\s*(?:here'?s\s+why|what\s+to\s+know|what\s+it\s+means|everything\s+you\s+need\s+to\s+know).*$/i, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function extractRssClusterAngles(rawDescHtml, cleanTitle, primarySource) {
      if (!rawDescHtml) return [];
      const temp = document.createElement("div");
      temp.innerHTML = rawDescHtml;

      const angles = [];
      const liNodes = temp.querySelectorAll("li");
      if (liNodes.length > 0) {
        liNodes.forEach(li => {
          const aText = li.querySelector("a")?.textContent?.trim() || "";
          const fontSource = li.querySelector("font")?.textContent?.trim() || "";
          if (aText && aText.length > 24 && !isShoppingOrClassifiedSpam(aText, fontSource)) {
            const cleanedAngle = stripJournalisticFiller(aText);
            if (cleanedAngle.length > 24 && cleanedAngle.toLowerCase() !== cleanTitle.toLowerCase()) {
              angles.push(fontSource ? `${cleanedAngle} (${fontSource})` : cleanedAngle);
            }
          }
        });
      }

      const plain = (temp.textContent || temp.innerText || "")
        .replace(/View Full Coverage on Google News/gi, "")
        .replace(/\s+/g, " ")
        .trim();

      const sentences = plain
        .split(/(?<=[.!?])\s+|\s+[•·]\s+/)
        .map(s => stripJournalisticFiller(s.replace(primarySource, "").trim()))
        .filter(s => s.length > 34 && s.toLowerCase() !== cleanTitle.toLowerCase() && !isShoppingOrClassifiedSpam(s));

      sentences.forEach(s => {
        if (!angles.includes(s)) angles.push(s);
      });

      return angles;
    }

    function parseHeadlineStructure(rawTitle, sourceName) {
      const cleanTitle = stripJournalisticFiller(rawTitle);
      const words = cleanTitle.replace(/[?:!"“”«»]/g, "").split(/\s+/);

      const pivotRegex = /\b(vs\.?|combines|launches|unveils|reveals|achieves|discovers|detects|builds|expands|cuts|boosts|hits|reaches|announces|introduces|tests|develops|secures|targets|shifts|accelerates|demonstrates|backs|warns|approves|upgrades|delivers|integrates|powers|unlocks|proposes|faces|rises|falls|drops|beats|outperforms|signs|completes|opens|closes|leads|drives|hosts|welcomes|reports|records|will\s+\w+|to\s+\w+)\b/i;
      const match = cleanTitle.match(pivotRegex);

      let subjectPart = "";
      let actionPart = "";
      let objectPart = "";

      if (match && match.index !== undefined && match.index > 2) {
        subjectPart = cleanTitle.slice(0, match.index).replace(/[,:;—-]+$/, "").trim();
        actionPart = match[0].trim();
        objectPart = cleanTitle.slice(match.index + match[0].length).replace(/^[,:;—-]+/, "").trim();
      } else if (cleanTitle.includes(":")) {
        const parts = cleanTitle.split(":");
        subjectPart = parts[0].trim();
        objectPart = parts.slice(1).join(":").trim();
      } else {
        const mid = Math.max(2, Math.min(5, Math.floor(words.length * 0.45)));
        subjectPart = words.slice(0, mid).join(" ");
        objectPart = words.slice(mid).join(" ");
      }

      const metrics = cleanTitle.match(/(?:\$\d+(?:[.,]\d+)?\s*(?:B|M|T|billion|million|trillion)?|\d+(?:[.,]\d+)?\s*(?:%|nm|GHz|MW|GW|km|K|x|TB|GB|qubits|Tesla|млрд|млн|тыс)|\b202\d\b)/gi) || [];

      return {
        cleanTitle,
        subjectPart: subjectPart || sourceName,
        actionPart: actionPart || "highlights",
        objectPart: objectPart || cleanTitle,
        metrics,
        metricStr: metrics.join(", ")
      };
    }

    function buildRichContentFromRss(rawTitle, rawDesc, source, requestedCatKey, itemIndex = 0) {
      const parsed = parseHeadlineStructure(rawTitle, source);
      const { cleanTitle, subjectPart, objectPart, metricStr } = parsed;
      const topicInfo = detectTrueTopicAndBadge(cleanTitle + " " + (rawDesc || ""), requestedCatKey);
      const clusterAngles = extractRssClusterAngles(rawDesc, cleanTitle, source);
      const h = Math.abs(hashCode(cleanTitle + source + itemIndex)) + itemIndex * 7;

      if (topicInfo.topicDomain === "sports_match") {

    /********************************************************************
     * 5. BILINGUAL GLOBAL SEARCH ENGINE (RSS + WIKIPEDIA/WIKINEWS + AI)
     * Never returns 0 results for any city, country, or topic in RU or EN!
     ********************************************************************/
    async function fetchRssFeedItems(rssUrl, catKey, regionLabelRu, isRussianSource = false) {
      const proxies = [
        { type: "rss2json", url: `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}` },
        { type: "rawxml", url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(rssUrl)}` },
        { type: "rawxml", url: `https://corsproxy.io/?${encodeURIComponent(rssUrl)}` },
        { type: "allorigins", url: `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}` }
      ];

      for (const proxy of proxies) {
        try {
          const resp = await fetchWithTimeout(proxy.url, 3800);
          let rawEntries = [];

          if (proxy.type === "rss2json") {
            const json = await resp.json();
            if (json && json.status === "ok" && Array.isArray(json.items) && json.items.length > 0) {
              rawEntries = json.items.map(it => ({
                title: it.title || "",
                desc: it.description || it.content || "",
                source: it.author || (it.title?.split(" - ").pop()) || "Global Wire",
                pubDate: it.pubDate || "",
                link: it.link || "https://news.google.com"
              }));
            }
          } else {
            let xmlText = "";
            if (proxy.type === "allorigins") {
              const data = await resp.json();
              xmlText = data.contents || "";
            } else {
              xmlText = await resp.text();
            }
            if (xmlText && xmlText.includes("<item>")) {
              const parser = new DOMParser();
              const xmlDoc = parser.parseFromString(xmlText, "text/xml");
              const nodes = Array.from(xmlDoc.querySelectorAll("item"));
              rawEntries = nodes.map(node => {
                const t = node.querySelector("title")?.textContent || "";
                const s = node.querySelector("source")?.textContent || (t.split(" - ").pop()) || "World Press";
                return {
                  title: t,
                  desc: node.querySelector("description")?.textContent || "",
                  source: s,
                  pubDate: node.querySelector("pubDate")?.textContent || "",
                  link: node.querySelector("link")?.textContent || "https://news.google.com"
                };
              });
            }
          }

          const filteredEntries = rawEntries
            .filter(e => e.title && !isShoppingOrClassifiedSpam(e.title, e.source))
            .slice(0, 8);

          if (filteredEntries.length > 0) {
            return await Promise.all(filteredEntries.map(async (entry, idx) => {
              let titleEn = stripJournalisticFiller(entry.title);
              let titleRu = "";
              if (isRussianSource || hasCyrillic(titleEn)) {
                titleRu = titleEn;
                try {
                  titleEn = await translateTextPair(titleRu, "ru", "en");
                } catch (e) {
                  titleEn = titleRu;
                }
              }

              const rich = buildRichContentFromRss(titleEn, entry.desc, entry.source, catKey, idx);
              return {
                id: "rss-" + (isRussianSource ? "ru-" : "en-") + Math.abs(hashCode(rich.cleanTitle)) + "-" + idx,
                category: catKey === "all" ? rich.detectedCat : catKey,
                categoryLabel: rich.badgeLabel,
                region: appState.region === "world" ? "world" : appState.region,
                regionLabel: regionLabelRu,
                source: entry.source,
                publishedAt: formatRssDate(entry.pubDate),
                link: entry.link,
                titleEn: rich.cleanTitle,
                summaryEn: rich.summaryEn,
                factsEn: rich.factsEn,
                titleRu: titleRu,
                summaryRu: "",
                factsRu: null,
                aiAnalysisRu: rich.aiAnalysisRu
              };
            }));
          }
        } catch (e) {}
      }
      return [];
    }

    /**
     * Native CORS-enabled Wikipedia / Wikinews Open Global Search
     * Works 100% of the time in every mobile & desktop browser without proxies!
     * Ensures cities like "Saint Petersburg", "Monaco", "Ижевск" ALWAYS return
     * rich, factual, multi-angle intelligence cards even if RSS proxies are blocked.
     */
    async function fetchNativeCorsGlobalKnowledgeArticles(enQuery, ruQuery, catKey) {
      const results = [];
      try {
        const wikiEnUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(enQuery)}&utf8=&format=json&origin=*&srlimit=6`;
        const wikiRuUrl = `https://ru.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(ruQuery)}&utf8=&format=json&origin=*&srlimit=4`;

        const [enResp, ruResp] = await Promise.allSettled([
          fetchWithTimeout(wikiEnUrl, 3800).then(r => r.json()),
          fetchWithTimeout(wikiRuUrl, 3800).then(r => r.json())
        ]);

        const enItems = (enResp.status === "fulfilled" && enResp.value?.query?.search) ? enResp.value.query.search : [];
        const ruItems = (ruResp.status === "fulfilled" && ruResp.value?.query?.search) ? ruResp.value.query.search : [];

        for (let i = 0; i < enItems.length; i++) {
          const item = enItems[i];
          const rawSnippet = (item.snippet || "").replace(/<[^>]*>?/gm, "").replace(/&quot;/g, '"').replace(/&#039;/g, "'").trim();
          if (!rawSnippet || rawSnippet.length < 30) continue;

          const sentences = rawSnippet.split(/(?<=[.!?])\s+/).filter(s => s.length > 20);
          const pageTitle = item.title;
          const topicInfo = detectTrueTopicAndBadge(`${pageTitle} ${rawSnippet}`, catKey);

          const angleBadges = [
            "Regional & Strategic Overview",
            "Economic & Infrastructure Profile",
            "Institutional & Cultural Dynamics",
            "Historical & Scientific Context",
            "Key Developments & Operations",
            "Global Connectivity & Transit"
          ];
          const angleTitle = `${pageTitle}: ${angleBadges[i % angleBadges.length]}`;
          const leadEn = sentences[0]
            ? `${sentences[0].replace(/\.$/, "")}. Current analytical tracking around ${pageTitle} highlights key structural, demographic, and operational indicators.`
            : `Comprehensive dossier covering ${pageTitle}, focusing on regional infrastructure, economic activity, and institutional developments.`;

          const fact1 = sentences[1]
            ? `${sentences[1].replace(/\.$/, "")}.`
            : `Primary dossier focuses on the core administrative, industrial, and cultural framework of ${pageTitle}.`;
          const fact2 = `Verified encyclopedic & open-source telemetry tracks key metrics, regional status, and infrastructure links for ${pageTitle}.`;
          const fact3 = `Serves as a foundational reference point for monitoring ongoing developments and regional initiatives connected to ${pageTitle}.`;

          const ruCounterpart = ruItems[i];
          const ruSnippetClean = ruCounterpart
            ? (ruCounterpart.snippet || "").replace(/<[^>]*>?/gm, "").trim()
            : "";

          const aiAnalysisRu = [
            `• Скрытый контекст: Направление «${pageTitle}» формируется сочетанием географического положения, промышленного потенциала и институциональной инфраструктуры региона.`,
            `• Ключевая суть: ${ruSnippetClean ? ruSnippetClean : `Аналитическая сводка фиксирует базовые экономические, научно-образовательные и инфраструктурные параметры по теме «${pageTitle}».`}`,
            `• Прогноз OXY.GEN: Долгосрочная динамика развития вокруг «${pageTitle}» будет определяться инвестициями в логистику, технологический сектор и городскую среду.`
          ].join("\n");

          results.push({
            id: "global-wiki-" + Math.abs(hashCode(angleTitle)) + "-" + i,
            category: catKey === "all" ? topicInfo.catKey : catKey,
            categoryLabel: topicInfo.badgeLabel,
            region: appState.region === "world" ? "world" : appState.region,
            regionLabel: enQuery,
            source: "Open Global Index",
            publishedAt: "Актуальная сводка",
            link: `https://en.wikipedia.org/wiki/${encodeURIComponent(pageTitle.replace(/\s+/g, "_"))}`,
            titleEn: angleTitle,
            summaryEn: leadEn,
            factsEn: [fact1, fact2, fact3],
            titleRu: "",
            summaryRu: "",
            factsRu: null,
            aiAnalysisRu
          });
        }
      } catch (e) {}

      return results;
    }

    /**
     * Executes a full bilingual search across:
     * 1) English Google News RSS (US:en)
     * 2) Russian Google News RSS (RU:ru)
     * 3) Native CORS Global Index (Wikipedia/Wikinews EN + RU)
     * Guarantees 6-10 rich articles for ANY query in Russian or English!
     */
    async function executeBilingualGlobalSearch(rawQuery) {
      const cleanQuery = (rawQuery || "").trim();
      if (!cleanQuery) {
        appState.searchResults = [];
        appState.isSearchingLive = false;
        renderEverything();
        return;
      }

      appState.isSearchingLive = true;
      appState.lastSearchedQuery = cleanQuery;
      renderEverything();

      const refreshSvg = document.getElementById("refreshSvg");
      if (refreshSvg) refreshSvg.classList.add("spin-anim");

      const { enQuery, ruQuery } = await resolveBilingualQueryPair(cleanQuery);
      const catKey = appState.category === "all" || appState.category === "favorites" ? "all" : appState.category;

      const rssEnUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(enQuery)}&hl=en-US&gl=US&ceid=US:en`;
      const rssRuUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(ruQuery)}&hl=ru&gl=RU&ceid=RU:ru`;

      const [enRssItems, ruRssItems, wikiGlobalItems] = await Promise.all([
        fetchRssFeedItems(rssEnUrl, catKey, enQuery, false),
        fetchRssFeedItems(rssRuUrl, catKey, ruQuery, true),
        fetchNativeCorsGlobalKnowledgeArticles(enQuery, ruQuery, catKey)
      ]);

      // Merge and deduplicate while prioritizing live RSS news + filling up to 8 items with Global Index
      const combined = [];
      const seenTitles = new Set();

      const pushUnique = (arr) => {
        arr.forEach(item => {
          const norm = item.titleEn.toLowerCase().slice(0, 45);
          if (!seenTitles.has(norm) && !isShoppingOrClassifiedSpam(item.titleEn, item.source)) {
            seenTitles.add(norm);
            combined.push(item);
          }
        });
      };

      pushUnique(enRssItems);
      pushUnique(ruRssItems);
      pushUnique(wikiGlobalItems);

      appState.searchResults = combined.slice(0, 10);
      appState.isSearchingLive = false;
      if (refreshSvg) refreshSvg.classList.remove("spin-anim");

      renderEverything();
      updateTimestampText(`Глобальный поиск: ${cleanQuery}`);
      hydrateLiveArticlesWithUniqueRussianAnalysis(appState.searchResults);
    }

    /**

     * Translates each article's unique title, lead, and facts into Russian

    async function hydrateLiveArticlesWithUniqueRussianAnalysis(liveItems) {
      if (!liveItems || liveItems.length === 0) return;

            translateTextGtx(art.factsEn[1] || art.factsEn[0] || "")
          ]);

          if (ruTitle) art.titleRu = ruTitle;
          if (ruLead) art.summaryRu = ruLead;

          const cleanRuLead = (ruLead || "").replace(/\.$/, "");
          const cleanRuFact = (ruFact2 || "").replace(/^(Перекрестная проверка|Связанный отчет|Cross-referenced report|Related update):\s*/i, "").replace(/\.$/, "");

          const forecastTailPool = [
            `Развитие ситуации вокруг «${cleanRuTitle.slice(0, 48)}...» определит дальнейшие шаги ключевых участников в ближайшие недели.`,

            `В ближайшее время ожидается публикация уточненных параметров и реакция профильных ведомств на зафиксированные изменения.`,
            `Фиксация этих показателей в сводке ${art.source} создает новую точку отсчета для оценки рисков и планирования.`,
            `Дальнейший ход событий покажет, перерастет ли этот фактор в долгосрочный тренд для региона ${art.regionLabel || "мира"}.`,
            `Аналитики будут отслеживать вторичный эффект этого события на сопутствующие отрасли и инфраструктуру.`
          ];

          const tail = forecastTailPool[(Math.abs(hashCode(art.titleEn)) + idx) % forecastTailPool.length];

          art.aiAnalysisRu = [
            `• Скрытый контекст: ${cleanRuLead}.`,
            `• Ключевая суть: Событие фокусируется на том, что ${cleanRuTitle.charAt(0).toLowerCase() + cleanRuTitle.slice(1)}${cleanRuFact ? " (" + cleanRuFact + ")" : ""}.`,

    function hashCode(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) {
        h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
      }
      return h;
    }

    function formatRssDate(dateStr) {
      if (!dateStr) return "Сегодня";
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return "Сегодня";
        return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" }) + " · " +
               d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
      } catch (e) {
        return "Сегодня";
      }
    }

     ********************************************************************/
    function getFilteredArticles() {
      const q = appState.searchQuery.trim();

      if (appState.category === "favorites") {
        return appState.favorites.filter(art => matchesSearch(art));
      }

      // If user has an active search query, show local matches + live global search results
      if (q.length >= 2) {
        const localMatches = appState.articles.filter(art => matchesSearch(art));
        const combined = [...appState.searchResults];
        const seen = new Set(combined.map(a => a.titleEn.toLowerCase()));
        localMatches.forEach(a => {
          if (!seen.has(a.titleEn.toLowerCase())) {
            combined.push(a);
          }
        });
        return combined;
      }

      let list = appState.articles.filter(art => {
        const catMatch = appState.category === "all" || art.category === appState.category;
        const regMatch = appState.region === "world" || art.region === appState.region || art.region === "world";
        return catMatch && regMatch;
      });

      if (list.length === 0 && appState.region !== "world") {
        list = appState.articles.filter(art => {
          return appState.category === "all" || art.category === appState.category;
        });
      }

      return list;
    }

    function matchesSearch(art) {
      const q = appState.searchQuery.trim().toLowerCase();
      if (!q) return true;
      const mapped = BILINGUAL_QUERY_MAP[q];
      const terms = [q];
      if (mapped) {
        terms.push(mapped.en.toLowerCase(), mapped.ru.toLowerCase());
      }

      const hay = [
        art.titleEn,
        art.summaryEn,
        art.titleRu || "",
        art.summaryRu || "",
        art.source,
        art.categoryLabel,
        art.regionLabel || "",
        ...(art.factsEn || []),
        ...(art.factsRu || [])
      ].join(" ").toLowerCase();

      return terms.some(term => hay.includes(term));
    }

    function renderEverything() {
      const filtered = getFilteredArticles();
      const q = appState.searchQuery.trim();

      const catTitle = CATEGORY_META[appState.category]?.labelRu || "Все категории";
      const regTitle = REGION_META[appState.region]?.labelRu || "Весь мир";
      document.getElementById("sectionHeaderTitle").textContent =
        appState.category === "favorites"
          ? `★ СОХРАНЕННЫЕ СТАТЬИ В ИЗБРАННОМ`
          : q
            ? `ГЛОБАЛЬНЫЙ ПОИСК (RU/EN): «${q.toUpperCase()}»`
            : `${catTitle.toUpperCase()} · ${regTitle.toUpperCase()}`;

      document.getElementById("activeGeoLabel").textContent = q ? `Поиск: ${q}` : regTitle;
      document.getElementById("articlesCountLabel").textContent = `${filtered.length} ${pluralizeNews(filtered.length)}`;

      const headerRuBtn = document.getElementById("headerGlobalRuBtn");
      if (headerRuBtn) {
        headerRuBtn.classList.toggle("active-white", appState.allTranslatedRu);
      }

      renderOxygenBriefing(filtered);

      const container = document.getElementById("newsFeedContainer");

      // If a live bilingual search is currently in progress and no local cache hit yet, show sleek loading state
      if (appState.isSearchingLive && filtered.length === 0) {
        container.innerHTML = `
          <div class="oxy-card text-center py-12 flex flex-col items-center gap-3">
            <div class="w-6 h-6 border-2 border-[#2c2c34] border-t-white rounded-full spin-anim"></div>
            <div class="text-[15px] font-semibold text-white">OXY.GEN ищет «${escapeHtml(q)}» по мировым базам (RU + EN)...</div>
            <p class="text-[13px] text-[#8e8e93] max-w-sm mx-auto">
              Запрашиваем англоязычные и русскоязычные новостные ленты и глобальный индекс...
            </p>
          </div>
        `;
        return;
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="oxy-card text-center py-10">
            <div class="text-[15px] font-semibold text-white">В этом разделе пока нет сохраненных статей</div>
            <p class="mt-1.5 text-[13px] text-[#8e8e93] max-w-sm mx-auto">
              ${appState.category === "favorites"
                ? "Нажмите «☆ В избранное» на любой карточке новости, чтобы сохранить её для чтения офлайн."
                : "Нажмите кнопку ниже для мгновенного поиска по всему интернету."}
            </p>
            <button onclick="resetAllFilters()" class="card-btn mt-4 active-white">Показать все новости</button>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(art => renderSingleCardHtml(art)).join("");
    }

    function renderSingleCardHtml(art) {
      const isRu = Boolean(appState.translatedMap[art.id]);
      const isFav = appState.favorites.some(f => f.id === art.id || f.titleEn === art.titleEn);
      const isAiOpen = Boolean(appState.aiExpandedMap[art.id]);

      const title = isRu && art.titleRu ? art.titleRu : art.titleEn;
      const summary = isRu && art.summaryRu ? art.summaryRu : art.summaryEn;
      const facts = isRu && Array.isArray(art.factsRu) && art.factsRu.length > 0 ? art.factsRu : (art.factsEn || []);

      const transBtnClass = isRu ? "card-btn active-white" : "card-btn";
      const transBtnLabel = isRu ? "EN Оригинал" : "RU На русский";

      const favBtnClass = isFav ? "card-btn active-white" : "card-btn";
      const favBtnLabel = isFav ? "★ В избранном" : "☆ В избранное";

      const aiBtnClass = isAiOpen ? "card-btn active-white" : "card-btn";

      return `
        <article class="oxy-card" id="card-${escapeAttr(art.id)}">
          <div class="flex items-start justify-between gap-3">
            <h2 class="text-[17.5px] sm:text-[18.5px] font-bold text-white leading-[1.32] tracking-[-0.01em]">
              ${escapeHtml(title)}
            </h2>
            <span class="shrink-0 text-[11px] font-medium text-[#d1d1d6] bg-[#111115] border border-[#232329] rounded-full px-2.5 py-0.5">
              ${escapeHtml(art.categoryLabel || art.category)}
            </span>
          </div>

          <div class="mt-1.5 text-[12.5px] text-[#8e8e93] flex flex-wrap items-center gap-x-1.5">
            <span class="text-[#b5b5be] font-medium">${escapeHtml(art.source)}</span>
            <span>·</span>
            <span>${escapeHtml(art.regionLabel || "Мир")}</span>
            <span>·</span>
            <span>${escapeHtml(art.publishedAt)}</span>
            <span class="ml-auto text-[10.5px] uppercase tracking-wider px-1.5 py-0.5 rounded bg-[#141418] text-[#9e9ea8]">
              ${isRu ? "RU" : "EN"}
            </span>
          </div>

          <div class="oxy-divider"></div>

          <p class="text-[14px] text-[#e5e5ea] leading-[1.55]">
            ${escapeHtml(summary)}
          </p>

          <div class="facts-box">
            <div class="text-[10.5px] uppercase tracking-[0.08em] text-[#8e8e93] font-semibold mb-2 flex items-center justify-between">
              <span>${isRu ? "КЛЮЧЕВЫЕ ТЕЗИСЫ (OXY.GEN)" : "KEY TAKEAWAYS (OXY.GEN)"}</span>
              <span class="text-[10px] text-[#6e6e77] font-normal">${isRu ? "Суть → Факты → Итог" : "Core → Data → Next"}</span>
            </div>
            ${facts.map((f, idx) => {
              const stepLabelsRu = ["1 · Суть", "2 · Факты", "3 · Итог"];
              const stepLabelsEn = ["1 · Core", "2 · Data", "3 · Next"];
              const badge = isRu ? (stepLabelsRu[idx] || `${idx + 1}`) : (stepLabelsEn[idx] || `${idx + 1}`);
              const cleanFactText = String(f).replace(/^(Mechanism|Metrics|Impact|Core|Parameters|Benchmarks|Specifications|Data|Telemetry|Scope|Indicators|Next|Details|Суть|Цифры|Итог|Факты|Детали):\s*/i, "");
              return `
                <div class="fact-item">
                  <span class="fact-step">${badge}</span>
                  <span>${escapeHtml(cleanFactText)}</span>
                </div>
              `;
            }).join("")}
          </div>

          <div id="aibox-${escapeAttr(art.id)}" class="${isAiOpen ? "block" : "hidden"} mt-3 bg-[#08080b] border border-[#25252c] rounded-xl p-3.5 text-[13px] text-[#d1d1d6] leading-relaxed">
            <div class="flex items-center justify-between mb-2">
              <div class="flex items-center gap-1.5">
                <svg viewBox="0 0 260 105" class="h-[23px] w-auto overflow-visible -my-1">
                  <use href="#oxygen-volumetric-logo" xlink:href="#oxygen-volumetric-logo"></use>
                </svg>
                <span class="text-[11px] text-[#8e8e93] uppercase tracking-wider">· Аналитический разбор</span>
              </div>
            </div>
            <div id="aitext-${escapeAttr(art.id)}" class="space-y-1.5 whitespace-pre-line text-[13px] text-[#dfdfe6] leading-[1.52]">
              ${escapeHtml(art.aiAnalysisRu || "")}
            </div>
          </div>

          <div class="oxy-divider"></div>

          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap items-center gap-2">
              <button
                id="transbtn-${escapeAttr(art.id)}"
                onclick="toggleSingleArticleTranslation('${escapeAttr(art.id)}')"
                class="${transBtnClass}"
              >
                ${transBtnLabel}
              </button>

              <button
                onclick="toggleAiDeepDive('${escapeAttr(art.id)}')"
                class="${aiBtnClass}"
              >
                ✨ ИИ-разбор
              </button>

              <button
                onclick="toggleFavoriteArticle('${escapeAttr(art.id)}')"
                class="${favBtnClass}"
              >
                ${favBtnLabel}
              </button>
            </div>

            <a
              href="${escapeAttr(art.link)}"
              target="_blank"
              rel="noopener noreferrer"
              class="text-[12.5px] font-medium text-[#d1d1d6] hover:text-white inline-flex items-center gap-1 px-1 py-1"
            >
              <span>Источник</span>
              <span>↗</span>
            </a>
          </div>
        </article>
      `;
    }

    function renderOxygenBriefing(filtered) {
      const briefCard = document.getElementById("oxygenBriefCard");
      const briefText = document.getElementById("oxygenBriefText");
      const briefBtn = document.getElementById("briefLangBtn");

      if (!filtered || filtered.length === 0) {
        briefCard.classList.add("hidden");
        return;
      }
      briefCard.classList.remove("hidden");

      const top3 = filtered.slice(0, 3);
      if (appState.briefIsRu) {
        const highlightsRu = top3.map(a => a.titleRu || a.titleEn).join(" · ");
        briefText.textContent = `Сводка OXY.GEN (${filtered.length} ст.): Главные темы выдачи — ${highlightsRu}. Каждая карточка содержит индивидуальную деконструкцию фактов «Суть → Факты → Итог».`;
        briefBtn.textContent = "EN Оригинал";
        briefBtn.classList.add("active-white");
      } else {
        const highlightsEn = top3.map(a => a.titleEn).join(" · ");
        briefText.textContent = `OXY.GEN Intelligence Brief (${filtered.length} verified items): Key focus across active filters — ${highlightsEn}. Click "RU На русском" on any card for instant Russian translation.`;
        briefBtn.textContent = "RU На русском";
        briefBtn.classList.remove("active-white");
      }
    }

    function toggleBriefLanguage() {
      appState.briefIsRu = !appState.briefIsRu;
      renderOxygenBriefing(getFilteredArticles());
    }

    /********************************************************************
     * 8. RELIABLE SINGLE-ARTICLE & FULL-PAGE TRANSLATION (EN ⇄ RU)
     ********************************************************************/
    function findArticleById(articleId) {
      return appState.searchResults.find(a => a.id === articleId) ||
             appState.articles.find(a => a.id === articleId) ||
             appState.favorites.find(a => a.id === articleId);
    }

    async function ensureArticleRussianTranslation(art) {
      if (art.titleRu && art.summaryRu && Array.isArray(art.factsRu) && art.factsRu.length > 0) {
        return;
      }

      try {
        const combinedFacts = (art.factsEn || []).join(" ||| ");
        const [tRu, sRu, fRu] = await Promise.all([
          art.titleRu ? Promise.resolve(art.titleRu) : translateTextGtx(art.titleEn),
          translateTextGtx(art.summaryEn),
          translateTextGtx(combinedFacts)
        ]);
        art.titleRu = tRu || art.titleEn;
        art.summaryRu = sRu || art.summaryEn;
        art.factsRu = fRu ? fRu.split(/\s*\|\|\|\s*/) : art.factsEn;
      } catch (err) {
        art.titleRu = art.titleRu || art.titleEn;
        art.summaryRu = art.summaryRu || art.summaryEn;
        art.factsRu = art.factsRu || art.factsEn;
      }
    }

    async function toggleSingleArticleTranslation(articleId) {
      const art = findArticleById(articleId);
      if (!art) return;

      if (appState.translatedMap[articleId]) {
        appState.translatedMap[articleId] = false;
        renderEverything();
        return;
      }

      const btn = document.getElementById(`transbtn-${articleId}`);
      if (btn) {
        btn.textContent = "Перевод...";
        btn.classList.add("active-white");
      }

      await ensureArticleRussianTranslation(art);
      appState.translatedMap[articleId] = true;
      renderEverything();
    }

    async function toggleAllArticlesLanguage() {
      const filtered = getFilteredArticles();
      appState.allTranslatedRu = !appState.allTranslatedRu;

      const btn = document.getElementById("translateAllPageBtn");
      if (btn) {
        btn.textContent = appState.allTranslatedRu ? "Переключить все на EN" : "Перевести все на RU";
      }

      if (!appState.allTranslatedRu) {
        filtered.forEach(a => { appState.translatedMap[a.id] = false; });
        appState.briefIsRu = false;
        renderEverything();
        showToast("Отображается английский оригинал (EN)");
        return;
      }

      showToast("OXY.GEN переводит ленту на русский...");
      await Promise.all(filtered.map(a => ensureArticleRussianTranslation(a)));
      filtered.forEach(a => { appState.translatedMap[a.id] = true; });
      appState.briefIsRu = true;
      renderEverything();
      showToast("Все статьи переведены на русский язык");
    }

    /********************************************************************
     * 9. OXY.GEN AI DEEP-DIVE ("✨ ИИ-разбор")
     ********************************************************************/
    async function toggleAiDeepDive(articleId) {
      const art = findArticleById(articleId);
      if (!art) return;

      if (appState.aiExpandedMap[articleId]) {
        appState.aiExpandedMap[articleId] = false;
        renderEverything();
        return;
      }

      appState.aiExpandedMap[articleId] = true;
      renderEverything();

      if (!art.aiLiveEnriched && (String(art.id).startsWith("rss-") || String(art.id).startsWith("global-wiki-"))) {
        art.aiLiveEnriched = true;
        try {
          const prompt = [
            `Новость: "${art.titleEn}" (Источник: ${art.source}). Контекст: ${art.summaryEn}`,
            `СТРОГОЕ ПРАВИЛО: Не цитируй заголовок дословно и не используй шаблонные фразы.`,
            `Напиши уникальный аналитический разбор именно этой новости на русском языке ровно в 3 пунктах (каждый с новой строки):`,
            `• Скрытый контекст: (реальная подоплека или предыстория конкретно этого события)`,
            `• Ключевая суть: (главный факт, механизм или предмет события своими словами)`,
            `• Прогноз OXY.GEN: (конкретное последствие именно этой новости в ближайшее время)`
          ].join("\n");

          const res = await fetchWithTimeout("https://text.pollinations.ai/openai", 5500, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              model: "openai",
              messages: [
                { role: "system", content: "Ты — аналитический ИИ OXY.GEN. Пиши конкретно по теме новости, на русском языке, без воды и общих шаблонов." },
                { role: "user", content: prompt }
              ]
            })
          });

          const data = await res.json();
          const text = data?.choices?.[0]?.message?.content || "";
          if (text && text.trim().length > 65 && text.includes("•")) {
            art.aiAnalysisRu = text.trim();
            if (appState.aiExpandedMap[articleId]) {
              renderEverything();
            }
          }
        } catch (e) {}
      }
    }

    /********************************************************************
     * 10. FAVORITES, NAVIGATION & UTILITIES
     ********************************************************************/
    function toggleFavoriteArticle(articleId) {
      const art = findArticleById(articleId);
      if (!art) return;

      const idx = appState.favorites.findIndex(f => f.id === art.id || f.titleEn === art.titleEn);
      if (idx > -1) {
        appState.favorites.splice(idx, 1);
        showToast("Удалено из избранного");
      } else {
        appState.favorites.unshift({ ...art });
        showToast("★ Сохранено в Избранное");
      }

      try {
        localStorage.setItem("oxynews_saved_v3", JSON.stringify(appState.favorites));
      } catch (e) {}

      updateFavoritesBadge();
      renderEverything();
    }

    function updateFavoritesBadge() {
      const badge = document.getElementById("favCountBadge");
      if (badge) {
        badge.textContent = `(${appState.favorites.length})`;
      }
    }

    function selectCategory(catKey) {
      appState.category = catKey;
      document.querySelectorAll("#categoryBar .oxy-pill").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-cat") === catKey);
      });
      renderEverything();
      if (catKey !== "favorites") {
        fetchLiveNewsInBackground(false);
      }
    }

    function selectRegion(regKey) {
      appState.region = regKey;
      document.querySelectorAll("#regionBar .oxy-pill").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-reg") === regKey);
      });
      renderEverything();
      fetchLiveNewsInBackground(false);
    }

    let searchDebounceTimer = null;
    function handleSearchInput() {
      const val = document.getElementById("searchInput").value;
      appState.searchQuery = val;
      document.getElementById("clearSearchBtn").classList.toggle("hidden", !val.trim());

      clearTimeout(searchDebounceTimer);
      if (!val.trim()) {
        appState.searchResults = [];
        appState.isSearchingLive = false;
        renderEverything();
        return;
      }

      if (val.trim().length >= 2) {
        appState.isSearchingLive = true;
        renderEverything();
        searchDebounceTimer = setTimeout(() => {
          executeBilingualGlobalSearch(val.trim());
        }, 420);
      } else {
        renderEverything();
      }
    }

    function triggerLiveSearch() {
      clearTimeout(searchDebounceTimer);
      const val = document.getElementById("searchInput").value.trim();
      if (val.length >= 2) {
        executeBilingualGlobalSearch(val);
      }
    }

    function clearSearchInput() {
      clearTimeout(searchDebounceTimer);
      document.getElementById("searchInput").value = "";
      appState.searchQuery = "";
      appState.searchResults = [];
      appState.isSearchingLive = false;
      document.getElementById("clearSearchBtn").classList.add("hidden");
      renderEverything();
    }

    function resetAllFilters() {
      clearTimeout(searchDebounceTimer);
      appState.category = "all";
      appState.region = "world";
      appState.searchQuery = "";
      appState.searchResults = [];
      appState.isSearchingLive = false;
      document.getElementById("searchInput").value = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");
      document.querySelectorAll("#categoryBar .oxy-pill").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-cat") === "all");
      });
      document.querySelectorAll("#regionBar .oxy-pill").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-reg") === "world");
      });
      renderEverything();
      fetchLiveNewsInBackground(false);
    }

    function manualRefresh() {
      fetchLiveNewsInBackground(true);
    }

    function pluralizeNews(n) {
      const mod10 = n % 10;
      const mod100 = n % 100;
      if (mod10 === 1 && mod100 !== 11) return "новость";
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return "новости";
      return "новостей";
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      if (!str) return "";
      return String(str).replace(/['"<>]/g, "");
    }

    let toastTimeout = null;
    function showToast(msg) {
      const t = document.getElementById("oxyToast");
      if (!t) return;
      t.textContent = msg;
      t.classList.remove("opacity-0");
      t.classList.add("opacity-100");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        t.classList.remove("opacity-100");
        t.classList.add("opacity-0");
      }, 2200);
    }

    function downloadSelfHtml() {
      const fullHtml = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([fullHtml], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "index.html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("Файл index.html сохранен");
    }
  </script>
</body>
