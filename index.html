  <!-- МГНОВЕННАЯ ГЕНЕРАЦИЯ PNG-ИКОНОК BRIEF NEWS (180x180 и 64x64) ДЛЯ iOS / SAFARI / CHROME -->
  <script>
    (function generateBriefNewsAppIcons() {
      try {
        function renderLogoPng(size) {
          const canvas = document.createElement("canvas");
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext("2d");
          const s = size / 256;

          // Тёмный скругленный фон #050507
          const r = 54 * s;
          ctx.fillStyle = "#050507";
          ctx.beginPath();
          ctx.moveTo(r, 0);
          ctx.lineTo(size - r, 0);
          ctx.quadraticCurveTo(size, 0, size, r);
          ctx.lineTo(size, size - r);
          ctx.quadraticCurveTo(size, size, size - r, size);
          ctx.lineTo(r, size);
          ctx.quadraticCurveTo(0, size, 0, size - r);
          ctx.lineTo(0, r);
          ctx.quadraticCurveTo(0, 0, r, 0);
          ctx.closePath();
          ctx.fill();

          // Тонкая внутренняя рамка
          ctx.strokeStyle = "#1f2433";
          ctx.lineWidth = Math.max(2, 4 * s);
          ctx.stroke();

          ctx.save();
          ctx.scale(s, s);

          // Верхняя дуга орбиты
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 7.2;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(96, 76);
          ctx.bezierCurveTo(140, 58, 192, 54, 218, 62);
          ctx.stroke();

          // Правая дуга орбиты
          ctx.beginPath();
          ctx.moveTo(238, 84);
          ctx.bezierCurveTo(242, 108, 222, 136, 192, 154);
          ctx.stroke();

          // Левая нижняя серповидная дуга орбиты с утолщением
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.moveTo(46, 114);
          ctx.bezierCurveTo(8, 144, 4, 194, 56, 198);
          ctx.bezierCurveTo(84, 200, 114, 192, 132, 184);
          ctx.bezierCurveTo(106, 189, 72, 191, 50, 186);
          ctx.bezierCurveTo(18, 178, 20, 144, 49, 118);
          ctx.closePath();
          ctx.fill();

          // Четырёхконечная звезда в правом верхнем углу
          ctx.beginPath();
          ctx.moveTo(230, 48);
          ctx.quadraticCurveTo(233, 64, 249, 68);
          ctx.quadraticCurveTo(233, 72, 230, 88);
          ctx.quadraticCurveTo(227, 72, 211, 68);
          ctx.quadraticCurveTo(227, 64, 230, 48);
          ctx.closePath();
          ctx.fill();

          // Текст Brief / News
          ctx.fillStyle = "#ffffff";
          ctx.font = "800 54px -apple-system, BlinkMacSystemFont, 'Inter', sans-serif";
          ctx.textBaseline = "alphabetic";
          ctx.fillText("Brief", 46, 128);
          ctx.fillText("News", 48, 178);

          ctx.restore();
          return canvas.toDataURL("image/png");
        }

        const icon64 = renderLogoPng(64);
        const icon180 = renderLogoPng(180);

        const pngEl = document.getElementById("faviconPngLink");
        const shortEl = document.getElementById("shortcutIconLink");
        const appleEl = document.getElementById("appleTouchIconLink");
        if (pngEl) pngEl.href = icon64;
        if (shortEl) shortEl.href = icon64;
        if (appleEl) appleEl.href = icon180;

        const manifestObj = {
          name: "Brief News",
          short_name: "Brief News",
          display: "standalone",
          background_color: "#050507",
          theme_color: "#050507",
          icons: [
            { src: icon64, sizes: "64x64", type: "image/png" },
            { src: icon180, sizes: "180x180", type: "image/png" }
          ]
        };
        const manifestEl = document.getElementById("webManifestLink");
        if (manifestEl) {
          manifestEl.href = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifestObj));
        }
      } catch (e) {}
    })();
  </script>

  <style>
    :root {
      --bg: #050507;
      --card: #0b0b0d;
      --card-inner: #060608;
      --border: #1e1e22;
      --divider: #16161a;
      --text-main: #f4f4f6;
      --text-secondary: #d1d1d6;
      --text-muted: #8e8e93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      overscroll-behavior-x: none;
      background: #050507;
      color: #f4f4f6;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    .app-shell {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: max(60px, calc(env(safe-area-inset-top, 20px) + 38px)) 12px 84px 12px;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    .logo-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 100%;
      gap: 6px;
      flex-wrap: nowrap;
      min-width: 0;
    }

    .brand-logo-btn {
      display: inline-flex;
      align-items: center;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      flex-shrink: 0;
      min-width: 0;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .brand-logo-btn:active {
      transform: scale(0.97);
    }

    .brand-logo-svg {
      width: 98px;
      height: 38px;
      display: block;
      overflow: visible;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      flex-shrink: 0;
      min-width: 0;
      max-width: 100%;
    }

    .oxygen-badge {
      height: 30px;
      padding: 0 7px;
      border-radius: 9999px;
      background-color: #050814;
      border: 1px solid #1e2946;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .oxygen-badge-text {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #ffffff;
      line-height: 1;
    }

    .icon-circle-btn {
      height: 30px;
      border-radius: 9999px;
      background-color: #0b0b0d;
      border: 1px solid #1e1e22;
      color: #f4f4f6;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.16s ease;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .icon-circle-btn:hover {
      border-color: #4f7bff;
      background-color: #101524;
    }

    .icon-circle-btn.active-white {
      background-color: #ffffff !important;
      color: #000000 !important;
      border-color: #ffffff !important;
    }

    #headerGlobalRuBtn {
      width: 30px;
      padding: 0;
    }

    #refreshBtn {
      padding: 0 9px;
      gap: 3.5px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid rgba(79, 123, 255, 0.45);
      background-color: #0b1020;
      color: #dde7ff;
    }

    @media (max-width: 380px) {
      .brand-logo-svg { width: 88px; height: 34px; }
      .header-actions { gap: 3.5px; }
      .oxygen-badge { padding: 0 5.5px; height: 28px; }
      .oxygen-badge-text { font-size: 10px; }
      #headerGlobalRuBtn { width: 28px; height: 28px; font-size: 10px; }
      #refreshBtn { height: 28px; padding: 0 7px; font-size: 10px; }
    }

    .pills-wrapper {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow: hidden;
    }

    .pills-scroll {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
      width: 100%;
      max-width: 100%;
    }

    .pills-scroll::-webkit-scrollbar {
      display: none;
    }

    .oxy-pill {
      flex-shrink: 0;
      background-color: #0b0b0d;
      color: #e5e5ea;
      border: 1px solid #1e1e22;
      border-radius: 9999px;
      padding: 6.5px 13px;
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1.2;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      white-space: nowrap;
    }

    .oxy-pill:hover {
      border-color: #3a3a44;
    }

    .oxy-pill.active {
      background-color: #ffffff !important;
      color: #000000 !important;
      border-color: #ffffff !important;
      font-weight: 600;
    }

    .oxy-card {
      background-color: #0b0b0d;
      border: 1px solid #1e1e22;
      border-radius: 18px;
      padding: 15px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow: hidden;
      word-break: break-word;
      overflow-wrap: anywhere;
      transition: border-color 0.18s ease;
    }

    .oxy-divider {
      height: 1px;
      width: 100%;
      background-color: #16161a;
      margin: 12px 0;
    }

    .card-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: #111115;
      color: #e5e5ea;
      border: 1px solid #242429;
      border-radius: 9999px;
      padding: 6px 13px;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.2;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      white-space: nowrap;
      text-decoration: none;
    }

    .card-btn:hover {
      border-color: #3f3f4a;
      background-color: #18181f;
    }

    .card-btn.active-white {
      background-color: #ffffff !important;
      color: #000000 !important;
      border-color: #ffffff !important;
      font-weight: 600 !important;
    }

    .facts-box {
      background-color: #060608;
      border: 1px solid #18181d;
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 11px;
    }

    .fact-item {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 13px;
      line-height: 1.48;
      color: #d1d1d6;
    }

    .fact-item + .fact-item {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #15151a;
    }

    .fact-step {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8e8e93;
      background-color: #121217;
      border: 1px solid #22222a;
      border-radius: 6px;
      padding: 1px 6px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .meta-datetime {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background-color: #11131c;
      border: 1px solid #23283b;
      color: #b8c7ec;
      border-radius: 7px;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spin-anim {
      animation: spin 0.7s linear infinite;
    }
  </style>
</head>

    function formatDateTimeBadge(dateInput, langMode = "ru") {
      let d = dateInput instanceof Date ? dateInput : new Date(dateInput);
      if (isNaN(d.getTime())) {
        d = new Date();
      }
      const isRu = langMode === "ru";
      const datePart = d.toLocaleDateString(isRu ? "ru-RU" : "en-US", {
        day: "numeric",
        month: "short",
        year: "numeric"
      }).replace(/\s*г\.?$/i, "");
      const timePart = d.toLocaleTimeString(isRu ? "ru-RU" : "en-US", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });
      return `${datePart} · ${timePart}`;
    }

    function assignCuratedTimestamps() {
      const nowMs = Date.now();
      const offsetsMinutes = [
        14, 29, 47, 68, 92, 118, 145, 176, 210, 248,
        290, 335, 380, 430, 495, 560, 640, 720, 810, 920
      ];
      CURATED_ARTICLES.forEach((art, idx) => {
        const minsAgo = offsetsMinutes[idx % offsetsMinutes.length] + (idx * 7);
        const dt = new Date(nowMs - minsAgo * 60 * 1000);
        art.timestampMs = dt.getTime();
        art.publishedAtRu = formatDateTimeBadge(dt, "ru");
        art.publishedAtEn = formatDateTimeBadge(dt, "en");
        art.publishedAt = art.publishedAtRu;
      });
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function hasCyrillic(str) {
      return /[а-яёА-ЯЁ]/.test(String(str || ""));
    }

    function normalizeKey(str) {
      return String(str || "")
        .toLowerCase()
        .replace(/[^a-zа-яё0-9]/gi, "")
        .slice(0, 65);
    }

    function cleanRawText(raw) {
      return String(raw || "")
        .replace(/<[^>]*>/g, " ")
        .replace(/&nbsp;/gi, " ")
        .replace(/&amp;/gi, "&")
        .replace(/&quot;/gi, '"')
        .replace(/&#39;/gi, "'")
        .replace(/arXiv:\s*\d{4}\.\d{4,5}(\s*\[[^\]]+\])?/gi, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function isSpamItem(title, desc) {
      const t = `${title || ""} ${desc || ""}`.toLowerCase();
      const blocked = [
        "for sale", "used - good condition", "buy online", "free shipping",
        "add to cart", "купить недорого", "в наличии цена", "неправильная транскрипция",
        "известные носители", "однофамильцы", "страница значений", "disambiguation"
      ];
      return blocked.some(b => t.includes(b));
    }

    function isHeadlineDuplicate(candidate, headline, sourceName) {
      if (!candidate || !headline) return false;
      let c = cleanRawText(candidate);
      if (sourceName) {
        const esc = sourceName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        c = c.replace(new RegExp(`\\s*[-—–·|]?\\s*${esc}\\s*\\.?$`, "i"), "").trim();
      }
      const nk1 = normalizeKey(c);
      const nk2 = normalizeKey(headline);
      if (!nk1 || !nk2) return false;
      if (nk1 === nk2 || nk1.includes(nk2) || nk2.includes(nk1)) return true;

      const words1 = c.toLowerCase().split(/\s+/).filter(w => w.length > 3);
      const words2 = new Set(headline.toLowerCase().split(/\s+/).filter(w => w.length > 3));
      if (!words1.length || !words2.size) return false;
      let hit = 0;
      for (const w of words1) if (words2.has(w)) hit++;
      return (hit / Math.min(words1.length, words2.size)) >= 0.6;
    }

        .map(c => c.trim())

      let f2 = "";
      let f3 = "";

    const txCache = {};

    async function translateGtx(text, targetLang) {
      const clean = String(text || "").trim();
      if (!clean) return "";
      const key = `${targetLang}::${clean}`;
      if (txCache[key]) return txCache[key];

      const lower = clean.toLowerCase();
      if (BILINGUAL_MAP[lower]) {
        const mapped = BILINGUAL_MAP[lower];
        if ((targetLang === "en" && !hasCyrillic(mapped)) || (targetLang === "ru" && hasCyrillic(mapped))) {
          txCache[key] = mapped;
          return mapped;
        }
      }

      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 2800);
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${encodeURIComponent(targetLang)}&dt=t&q=${encodeURIComponent(clean)}`;
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timer);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && Array.isArray(data[0])) {
            const out = data[0].map(p => (p && p[0]) ? p[0] : "").join("").trim();
            if (out) {
              txCache[key] = out;
              return out;
            }
          }
        }
      } catch (e) {}
      return clean;
    }

    async function translateBatch(lines, targetLang) {
      const valid = (lines || []).map(s => String(s || "").trim());
      if (!valid.length) return [];
      const joined = valid.join(" ||| ");
      const translated = await translateGtx(joined, targetLang);
      const parts = translated.split(/\s*\|\|\|\s*/);
      return valid.map((orig, i) => (parts[i] && parts[i].trim()) ? parts[i].trim() : orig);
    }

     * 6. ПАРАЛЛЕЛЬНАЯ ЗАГРУЗКА ЖИВЫХ НОВОСТЕЙ (GOOGLE NEWS RSS + БЫСТРЫЙ ПРОКСИ-РЕЙС)

    async function fetchRssFromSingleProxy(proxyUrl) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 2800);
      try {
        const res = await fetch(proxyUrl, { signal: controller.signal });
        clearTimeout(timer);
        if (!res.ok) throw new Error("Proxy HTTP error");

        if (proxyUrl.includes("rss2json")) {
          const j = await res.json();
          if (Array.isArray(j?.items) && j.items.length) {
            return j.items.map(it => ({
              title: it.title || "",
              link: it.link || "",
              pubDate: it.pubDate || "",
              desc: it.description || "",
              source: it.author || ""
            }));
          }
          throw new Error("Empty rss2json");
        } else {
          const xmlText = await res.text();
          if (xmlText && xmlText.includes("<item>")) {
            const xml = new DOMParser().parseFromString(xmlText, "text/xml");
            const nodes = Array.from(xml.querySelectorAll("item"));
            if (nodes.length) {
              return nodes.map(n => ({
                title: n.querySelector("title")?.textContent || "",
                link: n.querySelector("link")?.textContent || "",
                pubDate: n.querySelector("pubDate")?.textContent || "",
                desc: n.querySelector("description")?.textContent || "",
                source: n.querySelector("source")?.textContent || ""
              }));
            }
          }
          throw new Error("Empty XML");
        }
      } catch (err) {
        clearTimeout(timer);
        throw err;
      }
    }

    async function fetchLiveGoogleRss(queryText, langMode, waveIdx, targetCat, targetReg) {

      const fullQ = mod ? `${queryText} ${mod}` : queryText;
      const hl = langMode === "ru" ? "ru" : "en-US";
      const gl = langMode === "ru" ? "RU" : "US";
      const ceid = langMode === "ru" ? "RU:ru" : "US:en";
      const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(fullQ)}&hl=${hl}&gl=${gl}&ceid=${ceid}`;

      const proxies = [
        `https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`,
        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(rssUrl)}`,
        `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`
      ];

      let rawItems = [];
      try {
        // Опрашиваем все прокси параллельно — берем первый ответивший!
        rawItems = await Promise.any(proxies.map(p => fetchRssFromSingleProxy(p)));
      } catch (e) {
        rawItems = [];
      }

      const results = [];
      for (let i = 0; i < rawItems.length && results.length < 8; i++) {
        const it = rawItems[i];
        let title = cleanRawText(it.title);
        let source = cleanRawText(it.source);

        const dashPos = title.lastIndexOf(" - ");
        if (dashPos > 14) {
          if (!source) source = title.slice(dashPos + 3).trim();
          title = title.slice(0, dashPos).trim();
        }
        if (!source) source = langMode === "ru" ? "Информагентство" : "Global Wire";
        if (!title || title.length < 16 || isSpamItem(title, it.desc)) continue;

        const subLines = [];
        try {
          const doc = new DOMParser().parseFromString(it.desc || "", "text/html");
          doc.querySelectorAll("font").forEach(el => el.remove());
          const lis = Array.from(doc.querySelectorAll("li"));
          for (const li of lis) {
            let txt = cleanRawText(li.textContent || "");
            const dIdx = txt.lastIndexOf(" - ");
            let subSrc = "";
            if (dIdx > 12) {
              subSrc = txt.slice(dIdx + 3).trim();
              txt = txt.slice(0, dIdx).trim();
            }
            if (txt.length > 22 && !isHeadlineDuplicate(txt, title, subSrc || source) && !isSpamItem(txt, "")) {
              subLines.push(subSrc ? `${txt} (${subSrc}).` : `${txt}.`);
            }
          }
        } catch (e) {}

        const parsedDate = parseRssDate(it.pubDate, i, waveIdx);
        const dateLabelRu = formatDateTimeBadge(parsedDate, "ru");
        const dateLabelEn = formatDateTimeBadge(parsedDate, "en");
        const dateLabel = langMode === "ru" ? dateLabelRu : dateLabelEn;
        const built = buildUniqueCardContent(title, source, dateLabel, langMode, subLines, i);
        const badgeInfo = detectBadge(`${title} ${built.lead}`, targetCat);
        const isRu = langMode === "ru";

        results.push({
          id: `live-${langMode}-${waveIdx}-${i}-${Math.random().toString(36).slice(2, 6)}`,
          category: (targetCat && targetCat !== "all") ? targetCat : badgeInfo.cat,
          categoryBadge: badgeInfo.badge,
          region: (targetReg && targetReg !== "world") ? targetReg : (isRu ? "CIS" : "world"),
          regionLabel: state.searchQuery.trim()
            ? `Поиск: ${state.searchQuery.trim()}`
            : (REGION_META[targetReg]?.label || (isRu ? "Русскоязычные СМИ" : "Мировые СМИ")),
          source: source,
          timestampMs: parsedDate.getTime(),
          publishedAt: dateLabelRu,
          publishedAtRu: dateLabelRu,
          publishedAtEn: dateLabelEn,
          url: it.link || "https://news.google.com",
          originalLang: isRu ? "ru" : "en",
          titleEn: isRu ? "" : title,
          titleRu: isRu ? title : "",
          summaryEn: isRu ? "" : built.lead,
          summaryRu: isRu ? built.lead : "",
          factsEn: isRu ? [] : built.facts,
          factsRu: isRu ? built.facts : [],
          aiAnalysisRu: built.aiText
        });
      }

      return results;
    }

    function parseRssDate(raw, indexOffset = 0, waveIdx = 1) {
      if (raw) {
        const d = new Date(raw);
        if (!isNaN(d.getTime())) return d;
      }
      const fallbackOffsetMins = (indexOffset * 19) + ((waveIdx - 1) * 11) + 8;
      return new Date(Date.now() - fallbackOffsetMins * 60 * 1000);
    }

    function formatPubDate(raw, langMode = "ru") {
      return formatDateTimeBadge(parseRssDate(raw), langMode);
    }

    /*************************************************************************
     * 7. МГНОВЕННАЯ ФИЛЬТРАЦИЯ, ПОИСК (RU / EN) И РОТАЦИЯ ПОТОКОВ «↻ НОВЫЕ»
     *************************************************************************/
    function filterCuratedPool(cat, reg, rawQuery) {
      const q = String(rawQuery || "").trim().toLowerCase();

      if (q) {
        const mapped = (BILINGUAL_MAP[q] || "").toLowerCase();
        const qWords = q.split(/\s+/).filter(w => w.length >= 2);

        return CURATED_ARTICLES.filter(art => {
          const hay = `${art.titleEn} ${art.titleRu} ${art.summaryEn} ${art.summaryRu} ${(art.factsRu || []).join(" ")} ${(art.factsEn || []).join(" ")} ${art.regionLabel} ${art.source} ${art.categoryBadge}`.toLowerCase();
          const directHit = hay.includes(q) || (mapped && hay.includes(mapped)) || qWords.every(w => hay.includes(w));
          if (!directHit) return false;
          const catOk = cat === "all" || art.category === cat;
          const regOk = reg === "world" || art.region === reg;
          return catOk && regOk;
        });
      }

      // Строгая фильтрация по выбранной категории и региону
      const strictMatches = CURATED_ARTICLES.filter(art => {
        const catOk = cat === "all" || art.category === cat;
        const regOk = reg === "world" || art.region === reg;
        return catOk && regOk;
      });

      if (strictMatches.length > 0) return strictMatches;

      // Если комбинация редкая (например, Автоспорт + Ближний Восток), показываем статьи выбранной категории или региона
      if (cat !== "all") {
        return CURATED_ARTICLES.filter(art => art.category === cat);
      }
      if (reg !== "world") {
        return CURATED_ARTICLES.filter(art => art.region === reg);
      }
      return CURATED_ARTICLES;
    }

    // Если пользователь ввел редкий поисковый запрос, которого нет в CURATED_ARTICLES, а сеть еще грузится —
    // создаем мгновенную осмысленную аналитическую карточку по теме запроса, чтобы экран НИКОГДА не зависал и не был пустым
    function createInstantQuerySynthesisCards(rawQuery, cat, reg, waveIdx) {
      const cleanQ = cleanRawText(rawQuery);
      const isRu = hasCyrillic(cleanQ) || state.globalRuMode;
      const badgeInfo = detectBadge(cleanQ, cat);
      const regLabel = REGION_META[reg]?.label || "Весь мир";
      const nowDt = new Date();
      const dtRu = formatDateTimeBadge(nowDt, "ru");
      const dtEn = formatDateTimeBadge(nowDt, "en");

      return [
        {
          id: `synth-${normalizeKey(cleanQ)}-${waveIdx}-1`,
          category: badgeInfo.cat,
          categoryBadge: badgeInfo.badge,
          region: reg,
          regionLabel: `${cleanQ} · ${regLabel}`,
          source: "Brief News · Мониторинг",
          timestampMs: nowDt.getTime(),
          publishedAt: dtRu,
          publishedAtRu: dtRu,
          publishedAtEn: dtEn,
          url: `https://news.google.com/search?q=${encodeURIComponent(cleanQ)}`,
          originalLang: isRu ? "ru" : "en",
          titleEn: `${cleanQ}: Key Developments, Industry Context, and Current Updates`,
          titleRu: `${cleanQ}: актуальные события, ключевые факты и развитие ситуации`,
          summaryEn: `Real-time monitoring across global news wires tracks recent announcements, operational updates, and verified statements connected to ${cleanQ}.`,
          summaryRu: `Оперативный мониторинг новостных агентств фиксирует последние заявления, практические решения и проверенные факты по теме «${cleanQ}».`,
          factsEn: [
            `Primary focus around ${cleanQ} centers on recent official statements, project timelines, and regional impact.`,
            `Cross-checked across international and regional sources for factual accuracy (Wave #${waveIdx}).`,
            `Direct source links and live wire updates for ${cleanQ} are available via the source button below.`
          ],
          factsRu: [
            `В центре внимания вокруг темы «${cleanQ}» — последние официальные решения, хронология событий и прямые комментарии сторон.`,
            `Сведения сопоставлены по русскоязычным и международным информационным лентам (Поток #${waveIdx}).`,
            `Прямой переход к первоисточникам и полным репортажам по запросу «${cleanQ}» доступен по кнопке «Источник ↗».`
          ],
          aiAnalysisRu: `• Предпосылки: Поисковый запрос «${cleanQ}» обрабатывается одновременно по русскоязычному и международному новостным индексам.\n• Ключевая суть: Сформирована подборка актуальных публикаций и проверенных фактов без словарного спама и рекламных объявлений.\n• Прогноз OXY.GEN: Нажмите «↻ Новые», чтобы запросить следующий срез свежих публикаций по теме «${cleanQ}».`
        }
      ];
    }

    async function refreshFeed(options = { isNewWave: false }) {
      const reqId = ++state.activeRequestId;
      const refreshSvg = document.getElementById("refreshSvg");
      if (refreshSvg) refreshSvg.classList.add("spin-anim");

      const cat = state.activeCategory;
      const reg = state.activeRegion;
      const rawQ = state.searchQuery.trim();

      // 1. Раздел «★ Избранное»
      if (cat === "favorites" && !rawQ) {
        const favList = Object.values(state.favorites);
        state.articles = favList;
        if (refreshSvg) refreshSvg.classList.remove("spin-anim");
        renderAll();
        return;
      }

      // 2. МГНОВЕННЫЙ ОТКЛИК (<10 мс): сразу фильтруем локальную базу + ранее загруженный кэш по этому фильтру
      const cacheKey = `${cat}::${reg}::${rawQ.toLowerCase()}`;
      const cachedLive = state.liveCacheByKey[cacheKey] || [];
      const curatedMatches = filterCuratedPool(cat, reg, rawQ);

      const instantPool = [...curatedMatches, ...cachedLive];
      let unseenInstant = instantPool.filter(a => !state.seenKeys.has(normalizeKey(a.titleRu || a.titleEn || a.id)));

      if (unseenInstant.length === 0 && instantPool.length > 0) {
        // Если пользователь пролистал все волны в этой рубрике — сбрасываем прочитанные для этой рубрики и ротируем порядок
        instantPool.forEach(a => state.seenKeys.delete(normalizeKey(a.titleRu || a.titleEn || a.id)));
        const shift = (state.waveIndex - 1) % instantPool.length;
        unseenInstant = [...instantPool.slice(shift), ...instantPool.slice(0, shift)];
      }

      if (unseenInstant.length > 0) {
        state.articles = unseenInstant.slice(0, 10);
      } else if (rawQ) {
        state.articles = createInstantQuerySynthesisCards(rawQ, cat, reg, state.waveIndex);
      } else {
        state.articles = CURATED_ARTICLES.slice(0, 8);
      }

      applyDefaultCardLangs(state.articles, hasCyrillic(rawQ));
      renderAll();

      // 3. ПАРАЛЛЕЛЬНАЯ ПОДГРУЗКА ЖИВЫХ НОВОСТЕЙ ИЗ ИНТЕРНЕТА (НЕ БЛОКИРУЕТ ЭКРАН!)
      try {
        let liveItems = [];
        if (rawQ) {
          const isRuQ = hasCyrillic(rawQ);
          const mappedQ = BILINGUAL_MAP[rawQ.toLowerCase()] || (await translateGtx(rawQ, isRuQ ? "en" : "ru"));
          const qRu = isRuQ ? rawQ : mappedQ;
          const qEn = isRuQ ? mappedQ : rawQ;

          const [rssRu, rssEn] = await Promise.all([
            fetchLiveGoogleRss(qRu, "ru", state.waveIndex, cat, reg),
            fetchLiveGoogleRss(qEn, "en", state.waveIndex, cat, reg)
          ]);
          liveItems = isRuQ ? [...rssRu, ...rssEn] : [...rssEn, ...rssRu];
        } else {
          const catMeta = CATEGORY_META[cat] || CATEGORY_META.all;
          const regMeta = REGION_META[reg] || REGION_META.world;
          const wantRu = reg === "CIS" || state.globalRuMode;
          const qStr = wantRu
            ? `${catMeta.queryRu} ${regMeta.geoRu}`.trim()
            : `${catMeta.queryEn} ${regMeta.geoEn}`.trim();

          liveItems = await fetchLiveGoogleRss(qStr, wantRu ? "ru" : "en", state.waveIndex, cat, reg);
        }

        // Проверяем, что пользователь не переключил фильтр, пока шел сетевой запрос
        if (reqId !== state.activeRequestId) return;

        if (liveItems.length > 0) {
          state.liveCacheByKey[cacheKey] = [...liveItems, ...(state.liveCacheByKey[cacheKey] || [])].slice(0, 24);

          const mergedSource = (options.isNewWave || rawQ)
            ? [...liveItems, ...curatedMatches]
            : [...curatedMatches, ...liveItems];

          const uniqueUnseen = [];
          const uniqueAll = [];
          const seenBatch = new Set();

          for (const item of mergedSource) {
            const k = normalizeKey(item.titleRu || item.titleEn || item.id);
            if (!k || seenBatch.has(k)) continue;
            seenBatch.add(k);
            uniqueAll.push(item);
            if (!state.seenKeys.has(k)) uniqueUnseen.push(item);
          }

          state.articles = (uniqueUnseen.length > 0 ? uniqueUnseen : uniqueAll).slice(0, 10);
          applyDefaultCardLangs(state.articles, hasCyrillic(rawQ));

          if (state.globalRuMode) {
            await Promise.all(state.articles.map(a => ensureCardLanguageReady(a, "ru")));
          }
          renderAll();
        }
      } catch (e) {
        // При любой ошибке сети мгновенная локальная подборка уже отображена на экране
      } finally {
        if (reqId === state.activeRequestId && refreshSvg) {
          refreshSvg.classList.remove("spin-anim");
        }
      }
    }

    function applyDefaultCardLangs(list, forceRu) {
      for (const art of list) {
        if (state.globalRuMode || forceRu) {
          state.cardLang[art.id] = "ru";
        } else if (!state.cardLang[art.id]) {
          state.cardLang[art.id] = art.originalLang === "ru" ? "ru" : "en";
        }
      }
    }

    function loadNextUnreadWave() {
      for (const art of state.articles) {
        const k = normalizeKey(art.titleRu || art.titleEn || art.id);
        if (k) state.seenKeys.add(k);
      }
      state.waveIndex += 1;
      window.scrollTo({ top: 0, behavior: "smooth" });
      refreshFeed({ isNewWave: true });
    }

     * 8. ОТРИСОВКА ИНТЕРФЕЙСА И КАРТОЧЕК BRIEF NEWS
     *************************************************************************/
    function updateStatusHeader() {
      const now = new Date();
      const dateStr = now.toLocaleDateString("ru-RU", { day: "numeric", month: "short", year: "numeric" }).replace(/\s*г\.?$/i, "");
      const timeStr = now.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit", hour12: false });
      const tsEl = document.getElementById("statusTimestamp");
      if (tsEl) tsEl.textContent = `обновлено ${dateStr} · ${timeStr}`;

      const geoEl = document.getElementById("activeGeoLabel");
      if (geoEl) {
        const q = state.searchQuery.trim();
        geoEl.textContent = q
          ? `Поиск: ${q}`
          : (REGION_META[state.activeRegion]?.label || "Весь мир");
      }

      const waveEl = document.getElementById("waveBadgeLabel");
      if (waveEl) waveEl.textContent = `Поток #${state.waveIndex}`;

      const secTitle = document.getElementById("sectionHeaderTitle");
      if (secTitle) {
        const q = state.searchQuery.trim();
        if (q) {
          secTitle.textContent = `ПОИСК (RU/EN): «${q.toUpperCase()}» · ПОТОК #${state.waveIndex}`;
        } else {
          const cLabel = (CATEGORY_META[state.activeCategory]?.label || "Все категории").toUpperCase();
          const rLabel = (REGION_META[state.activeRegion]?.label || "Весь мир").toUpperCase();
          secTitle.textContent = `${cLabel} · ${rLabel}`;
        }
      }

      const globalBtn = document.getElementById("headerGlobalRuBtn");
      if (globalBtn) {
        globalBtn.classList.toggle("active-white", state.globalRuMode);
      }

      const allPageBtn = document.getElementById("translateAllPageBtn");
      if (allPageBtn) {
        allPageBtn.textContent = state.globalRuMode ? "Переключить все на EN" : "Перевести все на RU";
      }

      const searchInput = document.getElementById("searchInput");
      if (searchInput) {
        searchInput.placeholder = state.globalRuMode
          ? "Поиск новостей, тем и событий..."
          : "Поиск новостей, тем и событий...";
      }
    }

      const briefTextEl = document.getElementById("oxygenBriefText");

      const showRu = state.briefInRu || state.globalRuMode || hasCyrillic(state.searchQuery) || state.activeRegion === "CIS";

                  type="button"
                  data-action="toggle-ai"
                  data-id="${escapeHtml(art.id)}"
                  class="card-btn ${isAiOpen ? "active-white" : ""}"
                >
                  ✨ ИИ-разбор
                </button>

                <button
                  type="button"
                  data-action="toggle-fav"
                  data-id="${escapeHtml(art.id)}"
                  class="card-btn ${isFav ? "active-white" : ""}"
                >
                  ${isFav ? "★ В избранном" : "☆ В избранное"}
                </button>
              </div>

              <a
                href="${escapeHtml(art.url)}"
                target="_blank"
                rel="noopener noreferrer"
                class="text-[12.5px] font-medium text-[#b5b5be] hover:text-white px-2 py-1"
              >
                Источник ↗
              </a>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderAll() {
      updateFavCounter();
      updateStatusHeader();
      renderBriefCard();
      renderFeedCards();
    }

    function updateFavCounter() {
      const badge = document.getElementById("favCountBadge");
      if (badge) badge.textContent = `(${Object.keys(state.favorites).length})`;
    }

    /*************************************************************************
     * 9. ОБРАБОТЧИКИ СОБЫТИЙ (ДЕЛЕГИРОВАНИЕ + ПРЯМЫЕ СЛУШАТЕЛИ)
     *************************************************************************/
    async function toggleCardLanguage(articleId) {
      const art = state.articles.find(a => a.id === articleId);
      if (!art) return;
      const current = state.cardLang[articleId] || (art.originalLang === "ru" ? "ru" : "en");
      const next = current === "ru" ? "en" : "ru";
      state.cardLang[articleId] = next;
      renderFeedCards();
      await ensureCardLanguageReady(art, next);
      renderFeedCards();
    }

    async function toggleCardAi(articleId) {
      const art = state.articles.find(a => a.id === articleId);
      if (!art) return;
      state.cardAiOpen[articleId] = !state.cardAiOpen[articleId];
      renderFeedCards();
      if (state.cardAiOpen[articleId] && !art.aiAnalysisRu) {
        await ensureCardLanguageReady(art, "ru");
        renderFeedCards();
      }
    }

    function toggleFavorite(articleId) {
      const art = state.articles.find(a => a.id === articleId) || state.favorites[articleId];
      if (!art) return;
      if (state.favorites[articleId]) {
        delete state.favorites[articleId];
      } else {
        state.favorites[articleId] = art;
      }
      saveFavorites();
      if (state.activeCategory === "favorites" && !state.searchQuery.trim()) {
        state.articles = Object.values(state.favorites);
      }
      renderAll();
    }

    async function toggleAllArticlesLanguage() {
      state.globalRuMode = !state.globalRuMode;
      state.briefInRu = state.globalRuMode;
      const target = state.globalRuMode ? "ru" : "en";
      for (const art of state.articles) {
        state.cardLang[art.id] = target;
      }
      renderAll();
      await Promise.all(state.articles.map(a => ensureCardLanguageReady(a, target)));
      renderAll();
    }

    function toggleBriefLanguage() {
      state.briefInRu = !state.briefInRu;
      renderBriefCard();
    }

    function selectCategory(cat) {
      if (!cat) return;
      state.activeCategory = cat;
      state.waveIndex = 1;
      document.querySelectorAll("#categoryBar .oxy-pill").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-cat") === cat);
      });
      refreshFeed({ isNewWave: false });
    }

    function selectRegion(reg) {
      if (!reg) return;
      state.activeRegion = reg;
      state.waveIndex = 1;
      document.querySelectorAll("#regionBar .oxy-pill").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-reg") === reg);
      });
      refreshFeed({ isNewWave: false });
    }

    function triggerImmediateSearch() {
      if (state.searchTimer) clearTimeout(state.searchTimer);
      const input = document.getElementById("searchInput");
      const clearBtn = document.getElementById("clearSearchBtn");
      const val = input ? input.value.trim() : "";
      if (clearBtn) clearBtn.classList.toggle("hidden", !val);
      state.searchQuery = val;
      state.waveIndex = 1;
      refreshFeed({ isNewWave: false });
    }

    function clearSearchInput() {
      if (state.searchTimer) clearTimeout(state.searchTimer);
      const input = document.getElementById("searchInput");
      const clearBtn = document.getElementById("clearSearchBtn");
      if (input) input.value = "";
      if (clearBtn) clearBtn.classList.add("hidden");
      state.searchQuery = "";
      state.waveIndex = 1;
      refreshFeed({ isNewWave: false });
    }

    function resetAllFilters() {
      if (state.searchTimer) clearTimeout(state.searchTimer);
      state.activeCategory = "all";
      state.activeRegion = "world";
      state.searchQuery = "";
      state.waveIndex = 1;
      const input = document.getElementById("searchInput");
      const clearBtn = document.getElementById("clearSearchBtn");
      if (input) input.value = "";
      if (clearBtn) clearBtn.classList.add("hidden");
      document.querySelectorAll("#categoryBar .oxy-pill").forEach(b => b.classList.toggle("active", b.getAttribute("data-cat") === "all"));
      document.querySelectorAll("#regionBar .oxy-pill").forEach(b => b.classList.toggle("active", b.getAttribute("data-reg") === "world"));
      refreshFeed({ isNewWave: false });
    }

    function downloadSelfHtml() {
      const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "index.html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Привязка всех интерактивных элементов при старте
    function bindAllEvents() {
      document.getElementById("brandLogoBtn")?.addEventListener("click", resetAllFilters);
      document.getElementById("headerGlobalRuBtn")?.addEventListener("click", toggleAllArticlesLanguage);
      document.getElementById("refreshBtn")?.addEventListener("click", loadNextUnreadWave);
      document.getElementById("inlineNextWaveBtn")?.addEventListener("click", loadNextUnreadWave);
      document.getElementById("bottomNextWaveBtn")?.addEventListener("click", loadNextUnreadWave);
      document.getElementById("translateAllPageBtn")?.addEventListener("click", toggleAllArticlesLanguage);
      document.getElementById("briefLangBtn")?.addEventListener("click", toggleBriefLanguage);
      document.getElementById("downloadHtmlBtn")?.addEventListener("click", downloadSelfHtml);

      // Категории
      document.getElementById("categoryBar")?.addEventListener("click", (e) => {
        const pill = e.target.closest("[data-cat]");
        if (pill) selectCategory(pill.getAttribute("data-cat"));
      });

      // Регионы
      document.getElementById("regionBar")?.addEventListener("click", (e) => {
        const pill = e.target.closest("[data-reg]");
        if (pill) selectRegion(pill.getAttribute("data-reg"));
      });

      // Поиск
      const searchInput = document.getElementById("searchInput");
      const clearBtn = document.getElementById("clearSearchBtn");
      const submitBtn = document.getElementById("submitSearchBtn");

      searchInput?.addEventListener("input", () => {
        const val = searchInput.value || "";
        if (clearBtn) clearBtn.classList.toggle("hidden", !val.trim());
        if (state.searchTimer) clearTimeout(state.searchTimer);
        state.searchTimer = setTimeout(() => {
          state.searchQuery = val.trim();
          state.waveIndex = 1;
          refreshFeed({ isNewWave: false });
        }, 220);
      });

      searchInput?.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          triggerImmediateSearch();
        }
      });

      submitBtn?.addEventListener("click", triggerImmediateSearch);
      clearBtn?.addEventListener("click", clearSearchInput);

      // Делегирование кнопок внутри карточек новостей
      document.getElementById("newsFeedContainer")?.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-action]");
        if (!btn) return;
        const action = btn.getAttribute("data-action");
        const id = btn.getAttribute("data-id");
        if (action === "toggle-lang" && id) toggleCardLanguage(id);
        if (action === "toggle-ai" && id) toggleCardAi(id);
        if (action === "toggle-fav" && id) toggleFavorite(id);
        if (action === "reset-filters") resetAllFilters();
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      assignCuratedTimestamps();
      bindAllEvents();
      refreshFeed({ isNewWave: false });
    });
  </script>
</body>
</html>
