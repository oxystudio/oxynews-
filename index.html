<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Brief News</title>
<style>
:root{--card:#0d0d13;--line:#202029;--tx:#f5f5f7;--mut:#8b8b99;--a:#8ab4ff;--b:#c4a1ff;--on:#000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:#000}
body{margin:0;color:var(--tx);font:15px/1.45 -apple-system,'SF Pro Display','Segoe UI',Roboto,sans-serif;min-height:100vh;
background:radial-gradient(800px 380px at 85% -8%,color-mix(in srgb,var(--b) 16%,#000) 0,transparent 60%),radial-gradient(640px 340px at -10% 2%,color-mix(in srgb,var(--a) 14%,#000) 0,transparent 55%),#000;padding-top:env(safe-area-inset-top)}
button,input{font:inherit;color:var(--tx)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:flex}.main{flex:1;min-width:0}
.w{max-width:1100px;margin:0 auto;padding:0 16px 110px}
header{display:flex;align-items:center;gap:8px;padding:10px 0 6px}
.logo{height:62px;width:auto;display:block}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:22px;letter-spacing:-.035em;line-height:1}
.sp{flex:1}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#0e0e14;border:1px solid var(--line);border-radius:12px;height:40px;min-width:40px;padding:0 11px;cursor:pointer}
.sb{display:flex;gap:10px;margin:6px 0 12px}
.si{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px;color:var(--mut);transition:.2s}
.si:focus-within{border-color:var(--a);box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 22%,transparent)}
.si input{flex:1;min-width:0;background:none;border:0;outline:none;padding:14px 0}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:14px;cursor:pointer;transition:.15s}
.chip.on{background:var(--a);color:var(--on);border-color:var(--a);font-weight:600}
#st{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px;margin:12px 0 10px;min-height:20px}
#st i{width:7px;height:7px;border-radius:50%;background:var(--a);box-shadow:0 0 10px var(--a);flex:none}
#st.busy i{animation:pl 1s infinite}
.cols{display:block}.side{display:none}
.hero{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line)}
.hs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.sl{flex:none;width:100%;scroll-snap-align:start;position:relative;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;color:#fff;text-decoration:none}
.sl::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,transparent 20%,rgba(0,0,0,.88))}
.sl>*{position:relative;margin:0;z-index:2}
.sl>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;margin:0}
.sl h2{font-size:25px;line-height:1.15;letter-spacing:-.02em;margin:10px 0 6px}
.sl p{color:#d3d5e6;font-size:15px;margin:0 0 10px}
.tag{align-self:flex-start;border:1px solid #fff6;border-radius:99px;padding:2px 11px;font-size:12px;background:rgba(0,0,0,.4);backdrop-filter:blur(6px)}
.dots{position:absolute;right:16px;bottom:16px;display:flex;gap:6px}
.dots b{width:6px;height:6px;border-radius:50%;background:#fff5}.dots b.on{background:var(--a)}
.m{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mut)}
.sl .m{color:#c3c6dc}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 4px}
.sec h2{margin:0;font-size:21px;letter-spacing:-.02em}
.sec a{color:#4f8cff;font-size:13px;cursor:pointer}
.list:not(.all) .n:nth-child(n+7){display:none}
.n{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid #16161d;text-decoration:none;color:inherit;position:relative;animation:up .45s both}
.th{position:relative;overflow:hidden;flex:none;width:122px;height:88px;border-radius:12px;background-size:cover}
.nb{flex:1;min-width:0;padding-right:26px}
.nt{display:inline-block;font-size:11px;background:#1a1a24;border-radius:6px;padding:1px 8px}
.n h4{margin:5px 0;font-size:15.5px;line-height:1.3;font-weight:600}
.bm{position:absolute;right:0;bottom:12px;background:none;border:0;color:var(--a);font-size:18px;cursor:pointer;padding:4px}
.pn{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px}
.pn p{margin:8px 0;font-size:14px;color:#cfd1e4}.pn p.or{color:var(--mut)}
.ph{display:flex;align-items:center;gap:8px}.ph .i{color:var(--a)}
.lg{margin-left:auto;font-size:12px;background:#1a1a24;border-radius:8px;padding:2px 9px}
.rd{display:block;text-align:center;background:#171722;border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--tx);text-decoration:none;font-size:13px}
.pp{display:flex;gap:12px;padding:10px 0 0;color:inherit;text-decoration:none;font-size:14px}
.pp span{font-size:20px;color:var(--mut);width:18px}
.sk{border-radius:18px;margin-bottom:10px;background:linear-gradient(90deg,#0d0d13 25%,#18181f 50%,#0d0d13 75%);background-size:200% 100%;animation:sh 1.2s infinite}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));background:rgba(8,8,12,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tabs button,.rail button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 14px;border-radius:14px;cursor:pointer}
.tabs button.on{color:var(--a)}
.rail{display:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:50;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sh{background:#0e0e15;border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:82vh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.lb{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:14px 0 8px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.go{border:0;border-radius:14px;padding:12px 20px;font-weight:700;color:var(--on);cursor:pointer;background:linear-gradient(135deg,var(--a),var(--b));margin-top:16px;width:100%}
.fi{width:100%;background:#0a0a10;border:1px solid var(--line);border-radius:12px;padding:12px;outline:none;margin:6px 0}
@media(min-width:820px){
 .tabs{display:none}
 .rail{display:flex;flex-direction:column;gap:10px;position:sticky;top:0;height:100vh;padding:90px 14px;flex:none}
 .rail button{width:54px;height:54px;justify-content:center}.rail span{display:none}
 .rail button.on{background:var(--a);color:var(--on)}
 .w{padding-bottom:40px}
 .cols{display:grid;grid-template-columns:1fr 300px;gap:16px}.side{display:block}
 .sl{min-height:340px}.sl h2{font-size:32px}
 .list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
 .n{flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;gap:8px}
 .th{width:100%;height:120px}.nb{padding:0}.bm{bottom:10px;right:10px}
 .ov{align-items:center}.sh{border-radius:22px}
}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.logoBtn{background:none;border:0;padding:0;position:relative;cursor:pointer;display:block;color:#000}
.logoBtn:active{transform:scale(.97)}
.rb{position:absolute;right:-6px;bottom:4px;width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 14px #8ab4ff88}
.logoBtn.busy .rb svg{animation:spin 1s linear infinite}
.logoBtn.busy .logo{animation:pl 1.2s infinite}
.nw{background:linear-gradient(135deg,var(--a),var(--b));color:var(--on);font-size:10px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.ib.on{background:var(--a);color:var(--on);border-color:var(--a)}
.ar{position:fixed;inset:0;z-index:60;background:#000;overflow:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top);animation:up .25s both}
.ab{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(0,0,0,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.acov{position:relative;overflow:hidden;height:230px;background-size:cover;border-radius:0 0 22px 22px;max-width:720px;margin:0 auto}
.acov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.awrap{max-width:720px;margin:0 auto;padding:6px 18px calc(80px + env(safe-area-inset-bottom))}
.awrap h1{font-size:27px;line-height:1.18;letter-spacing:-.02em;margin:12px 0 8px}
.awrap p{font-size:16.5px;line-height:1.62;color:#d9dbec;margin:0 0 14px}
.awrap p.lead{font-size:18px;color:#fff;font-weight:500;margin-top:14px}
.awrap p.mt{font-size:12.5px;color:var(--mut)}
.facts{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin:18px 0}
.facts ul{margin:8px 0 0;padding-left:18px}.facts li{margin:6px 0;color:#d9dbec;font-size:15px}
a.orig{display:block;text-align:center;text-decoration:none}
.mt{font-size:12.5px;color:var(--mut);margin:8px 0}
#all{display:none}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw button.on{border-color:#fff;box-shadow:0 0 0 2px #000 inset}
.cc{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:14px}
.cc input{width:46px;height:34px;border:0;background:none;padding:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.more{min-height:56px;display:flex;justify-content:center;align-items:center;padding:14px 0 36px;color:var(--mut);font-size:13px;text-align:center}
.mp{display:flex;align-items:center;gap:8px}
.mp i{width:8px;height:8px;border-radius:50%;background:var(--a);box-shadow:0 0 10px var(--a);animation:pl 1s infinite}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes pl{50%{opacity:.25}}

<nav class="rail" id="rail"></nav>
<div class="main"><div class="w">

}

 document.querySelectorAll('#cats .chip[data-k]').forEach(e=>e.classList.toggle('on',cats.has(e.dataset.k)));

function imgErr(el){if(!el.dataset.t&&el.src.indexOf('/800/')>-1){el.dataset.t=1;el.src=el.src.replace('/800/','/240/')}else el.remove()}
function attach(u,src){document.querySelectorAll('a[data-k]').forEach(a=>{if(a.dataset.k!==u||a.querySelector('img'))return;const im=document.createElement('img');im.referrerPolicy='no-referrer';im.alt='';im.src=src;im.onerror=()=>imgErr(im);if(a.classList.contains('sl')){im.className='bg';a.insertBefore(im,a.firstChild)}else{const th=a.querySelector('.th');if(th)th.appendChild(im)}})}
async function fillImgs(items){
 const todo=items.filter(x=>!x.a.img&&x.a.url&&!/news\.google\.com/.test(x.a.url)).slice(0,12);
 let k=0;
 const run=async()=>{while(k<todo.length){const x=todo[k++];try{const r=await fetch(W+'/img?u='+encodeURIComponent(x.a.url),{signal:AbortSignal.timeout(9000)});const d=await r.json();if(d.img){x.a.img=d.img;attach(x.a.url,d.img)}}catch(e){}}};
 await Promise.all([run(),run(),run(),run()]);
}

function pickFeeds(q){
 const cs=[...ctry],tp=[...cats].map(x=>CATS[x]);
 let fs=FEEDS;
 if(cs.length){const f2=fs.filter(f=>cs.includes(f.c));if(f2.length)fs=f2}
 const cap=q?24:16;
 if(tp.length){
  const per=Math.ceil(cap/tp.length);
  const g=[...new Set(tp.flatMap(t=>fs.filter(f=>f.t.includes(t)).slice(0,per)))];
  fs=g.length?g:fs.filter(f=>f.t.includes('*'));
 }else if(!q)fs=fs.filter(f=>f.t.includes('*')).filter(f=>cs.length||['US','GB','RU','QA'].includes(f.c));
 return fs.slice(0,cap).map(f=>({...f,topic:tp.find(t=>f.t.includes(t))||(f.t[0]==='*'?'':f.t[0])}));
}

function decodeBuf(buf){
 const head=new TextDecoder('ascii').decode(buf.slice(0,200));
 const m=head.match(/encoding=["']([\w-]+)/i);
 try{return new TextDecoder(m?m[1]:'utf-8').decode(buf)}catch(e){return new TextDecoder().decode(buf)}
}
function imgFrom(x,desc){
 let u=at(x,'media:thumbnail','url');
 if(!u){for(const m of x.matchAll(/<media:content\b[^>]*>/gi)){const s=m[0],url=(s.match(/url=["']([^"']+)/)||[])[1];if(url&&(/type=["']image/i.test(s)||/medium=["']image/i.test(s)||/\.(jpe?g|png|webp)(\?|$)/i.test(url))){u=dec(url);break}}}
 if(!u){const m=x.match(/<enclosure\b[^>]*>/i);if(m){const url=(m[0].match(/url=["']([^"']+)/)||[])[1];if(url&&(/type=["']image/i.test(m[0])||/\.(jpe?g|png|webp)/i.test(url)))u=dec(url)}}
 if(!u){const m=desc.match(/<img[^>]+src=["']([^"']+)/i);if(m)u=dec(m[1])}
 if(!u)return '';
 u=u.replace(/^http:/,'https:');
 return /ichef\.bbci\.co\.uk/.test(u)?u.replace('/240/','/800/'):u;
}
function parseFeed(t,f){
 const out=[];
 for(const x of t.split(/<item[\s>]|<entry[\s>]/i).slice(1,26)){
  const title=tg(x,'title');
  let link=tg(x,'link');
  if(!link){for(const m of x.matchAll(/<link\b[^>]*>/gi)){if(/rel=["'](self|enclosure|replies)/i.test(m[0]))continue;const h=(m[0].match(/href=["']([^"']+)/)||[])[1];if(h){link=dec(h);break}}}
  if(!title||!link)continue;
  let source=f.n,img='';
  const raw=tg(x,'description')||tg(x,'summary')||tg(x,'content')||'';
  if(f.bing){const um=link.match(/[?&]url=([^&]+)/);if(um){try{link=decodeURIComponent(um[1])}catch(e){}}source=tg(x,'News:Source')||'Bing';img=tg(x,'News:Image').replace(/^http:/,'https:')}
  else img=imgFrom(x,raw);
  out.push({title,url:link,source,country:f.c,topic:f.topic||'',img,feed:f.n+f.u,bing:!!f.bing,
   date:Date.parse(tg(x,'pubDate')||tg(x,'published')||tg(x,'updated')||tg(x,'dc:date'))||0,
   desc:raw.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').slice(0,300)});
 }
 return out;
}
async function getFeed(f){

  }catch(e){}
 }
 return null;
}

function needles(q,kw){
 const set=new Set();
 const add=w=>{w=w.toLowerCase().trim();if(!w||/^\d+$/.test(w))return;if(w.length<3&&!(/[a-z]/.test(w)&&/\d/.test(w)))return;if(/[а-яё]/.test(w)&&w.length>5)w=w.slice(0,-2);set.add(w)};
 q.split(/[^\p{L}\p{N}]+/u).forEach(add);
 kw.forEach(k=>{k=k.toLowerCase().trim();if(k.indexOf(' ')>-1){if(k.length>=3)set.add(k)}else add(k)});
 return [...set];
}

 Object.values(g).forEach(v=>v.sort((x,y)=>y.date-x.date));
 const keys=Object.keys(g),out=[];
 for(let i=0;out.length<n;i++){let any=false;for(const k of keys){if(g[k][i]){out.push(g[k][i]);any=true;if(out.length>=n)break}}if(!any)break}
 return srt?out.sort((x,y)=>y.date-x.date):out;
}

async function gather(q){
 const jobs=pickFeeds(q).map(getFeed);
 if(q)bingFeeds(q).forEach(f=>jobs.push(getFeed(f)));
 const [res,kw]=await Promise.all([Promise.all(jobs),q?aiKeywords(q):Promise.resolve([])]);
 const ok=res.filter(Boolean).length;
 let all=res.filter(Boolean).flat();
 const sn=new Set();
 all=all.filter(a=>{const k=a.title.toLowerCase().slice(0,60);if(sn.has(k))return false;sn.add(k);return true});
 let ranked;
 if(q){
  const nd=needles(q,kw);
  all.forEach(a=>{const h=(a.title+' '+a.desc).toLowerCase();let s=0;nd.forEach(w=>{if(h.indexOf(w)>-1)s++});a.rel=s+(a.bing?1:0)});
  ranked=all.filter(a=>a.rel>0).sort((x,y)=>y.rel-x.rel||y.date-x.date);
 }else ranked=diverse(all,all.length,false);
 return {ranked,ok,total:jobs.length};
}
async function rankBatch(arts,intent){

   {role:'system',content:'Ты редактор новостей и переводчик. Отвечай строго в заданном формате, без пояснений и без markdown.'},
   {role:'user',content:'Интерес читателя: «'+intent+'».\nНиже новости (номер|заголовок|источник). Для КАЖДОЙ новости выведи одну строку формата:\nномер|оценка от 1 до 10|раздел|заголовок по-русски|суть одним коротким предложением по-русски\nРаздел — одно из: Технологии, Наука, Политика, Экономика, Спорт, Здоровье, Мир. Оценка — важность и соответствие интересу читателя (реклама, мелочи, не по теме — 1-4).\nПосле всех строк добавь последнюю строку: ANALYSIS|2-3 предложения по-русски: главное событие и почему оно важно.\n\n'+list}]})});
  const d=await r.json();
  if(d.error)throw new Error(d.error);
  const t=typeof d.text==='string'?d.text:JSON.stringify(d.text);
  const rows=[];
  for(const ln of t.split('\n')){
   const l=ln.trim();
   if(/^ANALYSIS\s*\|/i.test(l)){an=l.replace(/^ANALYSIS\s*\|/i,'').trim();continue}
   const m=l.match(/^(\d+)\s*\|\s*(\d+)\s*\|\s*([^|]*)\|\s*([^|]*)\|\s*(.*)$/);

 }catch(e){err=String(e.message||e).slice(0,80)}
 return {items,an,err,weak};
}

  box.innerHTML='';
 }catch(e){
  box.innerHTML='<div class="mp">Не удалось подгрузить. <button class="ib" id="mr">Ещё раз</button></div>';$('mr').onclick=loadMore;
 }finally{more.busy=false;if(!more.done)setTimeout(checkMore,500)}

function drawArticle(it,onlyBody){

  '<div class="acov" style="background:'+cover(c,it.ru)+'">'+imgTag(it,'')+'</div>'+

  '<a class="go orig" target="_blank" rel="noopener" href="'+esc(a.url)+'">Читать оригинал →</a></div>';

function isRu(s){const t=String(s).replace(/[^A-Za-zА-Яа-яЁё]/g,'');if(!t)return false;return (t.match(/[А-Яа-яЁё]/g)||[]).length/t.length>0.5}
async function buildArticle(it,upd){
 const a=it.a;let text='';
 try{const r=await fetch(W+'/text?u='+encodeURIComponent(a.url),{signal:AbortSignal.timeout(15000)});text=(await r.json()).text||''}catch(e){}
 let orig=text?text.split('\n').map(s=>s.trim()).filter(Boolean):[];
 const thin=text.length<400;
 if(thin){const extra=[a.desc].filter(x=>x&&x.length>20);orig=[...new Set(orig.concat(extra))]}
 if(!orig.length)orig=[a.title];
 const d=artCache[a.url]={orig,thin,ru:{paras:[],facts:[]},busy:false,done:0,total:0,same:false,err:''};
 const tick=()=>{if(upd)upd()};
 if(isRu(orig.join(' '))){d.ru.paras=orig;d.same=true;tick();return d}
 const chunks=[];let cu='';
 for(const p of orig){if(cu&&(cu.length+p.length+1)>2600){chunks.push(cu);cu=p}else cu=cu?cu+'\n'+p:p}
 if(cu)chunks.push(cu);
 d.total=chunks.length;d.busy=true;tick();
 const out=new Array(chunks.length);let idx=0,fails=0;
 const publish=()=>{const ps=[];for(let k=0;k<out.length;k++){if(out[k]===undefined)break;ps.push(...out[k])}d.ru.paras=ps;d.done=out.filter(x=>x!==undefined).length};
 const one=async()=>{
  while(idx<chunks.length){
   const i=idx++;let res=null;
   for(let t=0;t<2&&!res;t++){
    try{
     const r=await fetch(W+'/ai',{method:'POST',signal:AbortSignal.timeout(50000),headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[
      {role:'system',content:'Ты профессиональный переводчик новостей на русский язык.'},
      {role:'user',content:'Переведи следующий текст на русский язык полностью, точно и литературно. НИЧЕГО не сокращай, не пересказывай и не пропускай: каждый абзац переведи целиком, сохрани все детали, цифры, имена и цитаты. Не добавляй комментариев и пояснений. Абзацы разделяй переводом строки. Выведи только перевод.\n\n'+chunks[i]}]})});
     const j=await r.json();if(j.error)throw new Error(j.error);
     const tt=String(j.text||'').trim();
     if(tt)res=tt.split(/\n+/).map(s=>s.trim()).filter(Boolean);
    }catch(e){}
   }
   if(!res){fails++;res=chunks[i].split('\n')}
   out[i]=res;publish();tick();
  }
 };
 await Promise.all([one(),one()]);
 d.busy=false;
 if(fails)d.err=fails===chunks.length?'ИИ не смог перевести — показан оригинал.':'Часть текста не удалось перевести — она показана в оригинале.';
 tick();return d;
}

 if(d&&d.err&&!d.busy&&!d.ru.paras.length){delete artCache[u];d=null}
 drawArticle(it);
 if(!it.a.img)fetch(W+'/img?u='+encodeURIComponent(u),{signal:AbortSignal.timeout(9000)}).then(r=>r.json()).then(j=>{if(j.img&&openItem===it){it.a.img=j.img;drawArticle(it)}}).catch(()=>{});
 if(!d){await buildArticle(it,()=>{if(openItem===it&&!$('ar').hidden&&g===artGen)drawArticle(it,true)});if(g===artGen&&openItem===it&&!$('ar').hidden)drawArticle(it,true)}
}

const SW=['#8ab4ff','#b794ff','#ff7a9c','#ffb454','#5eead4','#4ade80','#f472b6','#facc15'];
function applyAccent(h){
 if(!/^#[0-9a-f]{6}$/i.test(h||''))h='#8ab4ff';
 accent=h;put('bn_acc',h);
 const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
 const R=r/255,G=g/255,B=b/255,mx=Math.max(R,G,B),mn=Math.min(R,G,B),l=(mx+mn)/2,d=mx-mn;
 let hh=0,s=0;
 if(d){s=l>.5?d/(2-mx-mn):d/(mx+mn);hh=mx===R?((G-B)/d+(G<B?6:0)):mx===G?((B-R)/d+2):((R-G)/d+4);hh*=60}
 const b2='hsl('+Math.round((hh+45)%360)+' '+Math.round(Math.max(s,.5)*100)+'% '+Math.round(Math.min(Math.max(l,.62),.78)*100)+'%)';
 const lum=(0.299*r+0.587*g+0.114*b)/255,sty=document.documentElement.style;
 sty.setProperty('--a',h);sty.setProperty('--b',b2);sty.setProperty('--on',lum>.6?'#000':'#fff');
 document.querySelectorAll('#sw button').forEach(x=>x.classList.toggle('on',x.dataset.c===h.toLowerCase()));
 const cc=$('cc');if(cc)cc.value=h;
}

 try{
  const r=await fetch(W+'/auth/'+kind,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u,pass:p})});

(function(){
 const el=$('ar');let sx=0,sy=0,dx=0,drag=false,lock='';
 el.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;drag=true;lock='';el.style.animation='none'},{passive:true});
 el.addEventListener('touchmove',e=>{
  if(!drag)return;
  const x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;
  if(!lock){if(Math.abs(x)>12&&Math.abs(x)>Math.abs(y)*1.4)lock='x';else if(Math.abs(y)>12)lock='y'}
  if(lock==='x'){dx=x;el.style.transition='none';el.style.transform='translateX('+x+'px)';el.style.opacity=String(Math.max(.4,1-Math.abs(x)/500))}
 },{passive:true});
 el.addEventListener('touchend',()=>{
  if(!drag)return;drag=false;
  el.style.transition='transform .22s ease,opacity .22s ease';
  if(lock==='x'&&Math.abs(dx)>90){
   el.style.transform='translateX('+(dx>0?'100%':'-100%')+')';el.style.opacity='0';
   setTimeout(()=>{backArt();el.style.transition='';el.style.transform='';el.style.opacity=''},210);
  }else{el.style.transform='';el.style.opacity='';setTimeout(()=>{el.style.transition=''},240)}
 });
})();
