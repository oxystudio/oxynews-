<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>OXYnews. — Powered by OXY.GEN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000000;
      --card: #0b0b0d;
      --card-inner: #060608;
      --border: #1e1e22;
      --divider: #16161a;
      --text-main: #f3f3f5;
      --text-secondary: #d1d1d6;
      --text-muted: #8e8e93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      display: block;
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      overscroll-behavior-x: none;
      background: #000000;
      color: #f3f3f5;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      position: relative;
    }

    /* Generous top safe-area offset so mobile/iOS preview bars never cover the OXYnews. header */
    .app-shell {
      width: 100%;
      max-width: 660px;
      margin: 0 auto;
      padding-top: 78px;
      padding: calc(env(safe-area-inset-top, 24px) + 54px) 16px 90px 16px;
      overflow-x: hidden;
    }

    @supports (padding-top: max(0px)) {
      .app-shell {
        padding-top: max(76px, calc(env(safe-area-inset-top, 24px) + 54px));
      }
    }

    /* Horizontal filter scrollers strictly locked inside viewport */
    .pills-wrapper {
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }

    .pills-scroll {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
      width: 100%;
    }

    .pills-scroll::-webkit-scrollbar {
      display: none;
    }

    .oxy-pill {
      flex-shrink: 0;
      background-color: #0b0b0d;
      color: #e5e5ea;
      border: 1px solid #1e1e22;
      border-radius: 9999px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.2;
      cursor: pointer;
      transition: all 0.16s ease;
      user-select: none;
      white-space: nowrap;
    }

    .oxy-pill:hover {
      border-color: #3a3a42;
      color: #ffffff;
    }

    .oxy-pill.active {
      background-color: #ffffff;
      color: #000000;
      border-color: #ffffff;
      font-weight: 600;
    }

    .oxy-card {
      background-color: #0b0b0d;
      border: 1px solid #1e1e22;
      border-radius: 18px;
      padding: 18px;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .oxy-card:hover {
      border-color: #2c2c34;
    }

    .oxy-divider {
      height: 1px;
      width: 100%;
      background-color: #16161a;
      margin: 12px 0;
    }

    .card-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: #111115;
      color: #e5e5ea;
      border: 1px solid #242429;
      border-radius: 9999px;
      padding: 6px 13px;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.2;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      white-space: nowrap;
      text-decoration: none;
    }

    .card-btn:hover {
      border-color: #3f3f48;
      color: #ffffff;
    }

    .card-btn.active-white {
      background-color: #ffffff !important;
      color: #000000 !important;
      border-color: #ffffff !important;
      font-weight: 600 !important;
    }

    .icon-circle-btn {
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      background-color: #0b0b0d;
      border: 1px solid #1e1e22;
      color: #f3f3f5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.16s ease;
      flex-shrink: 0;
    }

    .icon-circle-btn:hover {
      border-color: #3a3a42;
      background-color: #141418;
    }

    .icon-circle-btn.active-white {
      background-color: #ffffff !important;
      color: #000000 !important;
      border-color: #ffffff !important;
    }

    .facts-box {
      background-color: #060608;
      border: 1px solid #18181d;
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 11px;
    }

    .fact-item {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 13px;
      line-height: 1.48;
      color: #d1d1d6;
    }

    .fact-item + .fact-item {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #15151a;
    }

    .fact-step {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8e8e93;
      background-color: #121217;
      border: 1px solid #22222a;
      border-radius: 6px;
      padding: 1px 6px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spin-anim {
      animation: spin 0.75s linear infinite;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <!-- HEADER (Positioned comfortably below mobile top overlay bars) -->
    <header class="pb-4 border-b border-[#16161a]">
      <div class="flex items-center justify-between gap-2">
        <!-- Left Header: Crisp SVG OXYnews. Logo -->
        <button onclick="resetAllFilters()" class="text-left focus:outline-none group shrink-0" title="Сбросить фильтры">
          <svg viewBox="0 0 235 50" class="h-[38px] sm:h-[42px] w-auto overflow-visible" aria-label="OXYnews.">
            <text x="0" y="39" fill="#ffffff" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-size="45" font-weight="600" letter-spacing="-0.4">OXYnews.</text>
          </svg>
        </button>

        <!-- Right Header: OXY.GEN Cloud Badge + Global RU Toggle + Refresh Button -->
        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
          <!-- Unobtrusive OXY.GEN Cloud Logo Badge -->
          <div class="bg-[#0b0b0d] border border-[#1e1e22] rounded-full px-2.5 py-1.5 flex items-center" title="Нейросетевой движок фильтрации OXY.GEN">
            <svg viewBox="0 0 156 44" class="h-[18px] sm:h-[20px] w-auto overflow-visible" aria-label="OXY.GEN">
              <path d="M 80 36
                       C 72 36, 68 31, 70 24
                       C 71 19, 76 16, 82 17
                       C 86 7, 98 3, 109 6
                       C 118 8, 123 15, 123 21
                       C 129 19, 136 22, 137 28
                       C 143 29, 147 32, 146 36
                       C 145 39, 140 40, 134 40
                       L 82 40 Z"
                    fill="#8e8e93" fill-opacity="0.58" />
              <text x="2" y="35" fill="#ffffff" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-size="31" font-weight="600" letter-spacing="0.5">OXY.GEN</text>
            </svg>
          </div>

          <!-- Global RU Translation Circle Button -->
          <button
            id="headerGlobalRuBtn"
            onclick="toggleAllArticlesLanguage()"
            class="icon-circle-btn"
            title="Перевести всю страницу на русский / английский"
          >
            RU
          </button>

          <!-- Circular Refresh Button -->
          <button
            id="refreshBtn"
            onclick="manualRefresh()"
            class="icon-circle-btn"
            title="Обновить новости"

            <svg id="refreshSvg" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          </button>
        </div>
      </div>

      <div class="mt-2 text-[12.5px] text-[#8e8e93] leading-snug flex flex-wrap items-center gap-x-1.5 gap-y-0.5">
        <span>Интеллектуальная лента новостей</span>
        <span>·</span>
        <span id="statusTimestamp">обновлено только что</span>
        <span>·</span>
        <span id="activeGeoLabel" class="text-[#b5b5be]">Весь мир</span>
      </div>
    </header>

    <!-- SEARCH BAR -->
    <div class="mt-4 relative w-full">
      <svg class="w-4 h-4 text-[#8e8e93] absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <input
        id="searchInput"
        type="text"
        placeholder="Поиск: квантовая физика, термоядерный синтез, ИИ, геополитика..."
        class="w-full bg-[#0b0b0d] border border-[#1e1e22] focus:border-[#454550] rounded-[14px] pl-11 pr-20 py-3 text-[14px] text-white placeholder-[#787880] outline-none transition"
        oninput="handleSearchInput()"
        onkeydown="if(event.key==='Enter'){triggerLiveSearch();}"
      />
      <button
        id="clearSearchBtn"
        onclick="clearSearchInput()"
        class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-[11px] bg-[#18181d] hover:bg-[#25252c] text-[#d1d1d6] px-2.5 py-1 rounded-full"
      >
        Сброс
      </button>
    </div>

    <!-- CATEGORY FILTER PILLS -->
    <div class="mt-3.5 pills-wrapper">
      <div class="pills-scroll" id="categoryBar">
        <button class="oxy-pill active" data-cat="all" onclick="selectCategory('all')">Все</button>
        <button class="oxy-pill" data-cat="favorites" onclick="selectCategory('favorites')">★ Избранное <span id="favCountBadge" class="ml-0.5 opacity-80">(0)</span></button>
        <button class="oxy-pill" data-cat="physics" onclick="selectCategory('physics')">Физика</button>
        <button class="oxy-pill" data-cat="tech" onclick="selectCategory('tech')">Технологии</button>
        <button class="oxy-pill" data-cat="ai" onclick="selectCategory('ai')">ИИ & Нейросети</button>
        <button class="oxy-pill" data-cat="science" onclick="selectCategory('science')">Наука</button>
        <button class="oxy-pill" data-cat="space" onclick="selectCategory('space')">Космос</button>
        <button class="oxy-pill" data-cat="politics" onclick="selectCategory('politics')">Политика</button>

      <div class="pills-scroll" id="regionBar">

        <button class="oxy-pill" data-reg="EU" onclick="selectRegion('EU')">Европа (EU/UK)</button>

        <button class="oxy-pill" data-reg="CIS" onclick="selectRegion('CIS')">СНГ / Вост. Европа</button>
      </div>
    </div>

    <!-- OXY.GEN EXECUTIVE BRIEFING CARD -->
    <section id="oxygenBriefCard" class="oxy-card mt-4">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <svg viewBox="0 0 156 44" class="h-[17px] w-auto overflow-visible" aria-label="OXY.GEN">
            <path d="M 80 36 C 72 36, 68 31, 70 24 C 71 19, 76 16, 82 17 C 86 7, 98 3, 109 6 C 118 8, 123 15, 123 21 C 129 19, 136 22, 137 28 C 143 29, 147 32, 146 36 C 145 39, 140 40, 134 40 L 82 40 Z" fill="#8e8e93" fill-opacity="0.58" />

        </div>

        <button
          id="briefLangBtn"
          onclick="toggleBriefLanguage()"
          class="card-btn text-[11px] py-1 px-2.5"
        >
          RU На русском
        </button>
      </div>

      <p id="oxygenBriefText" class="mt-2.5 text-[13.5px] leading-relaxed text-[#d1d1d6]"></p>
    </section>

    <!-- SECTION HEADER BAR -->
    <div class="mt-5 mb-2.5 flex items-center justify-between px-1">
      <div id="sectionHeaderTitle" class="text-[11.5px] font-semibold uppercase tracking-[0.12em] text-[#8e8e93]">
        ВСЕ КАТЕГОРИИ · ВЕСЬ МИР

      <div class="flex items-center gap-3">
        <button
          id="translateAllPageBtn"
          onclick="toggleAllArticlesLanguage()"
          class="text-[11.5px] text-[#b5b5be] hover:text-white underline underline-offset-4 cursor-pointer"
        >
          Перевести все на RU
        </button>
        <span id="articlesCountLabel" class="text-[11.5px] text-[#8e8e93]">0 новостей</span>
      </div>
    </div>

    <!-- NEWS CARDS FEED -->
    <main id="newsFeedContainer" class="flex flex-col gap-3.5"></main>

    <!-- FOOTER WITH AUTONOMOUS GITHUB PAGES DOWNLOAD & SUBTLE OXY.GEN LOGO -->
    <footer class="mt-10 pt-6 border-t border-[#16161a] flex flex-col items-center gap-3 text-center">

      </div>

      <p class="text-[11.5px] text-[#6e6e77] max-w-md">

      </p>

      <button
        onclick="downloadSelfHtml()"
        class="card-btn px-4 py-2 text-[12px] border-[#2c2c34]"
      >
        ⬇ Скачать index.html для GitHub Pages
      </button>
    </footer>
  </div>

    async function fetchWithTimeout(url, timeoutMs = 4200) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timer);
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res;
      } catch (err) {
        clearTimeout(timer);
        throw err;
      }
    }

    function cleanHtmlText(raw) {
      if (!raw) return "";
      const tmp = document.createElement("div");
      tmp.innerHTML = raw;
      return (tmp.textContent || tmp.innerText || "").replace(/\s+/g, " ").trim();
    }

    /**
     * Removes any repetition of the headline or source name from raw RSS descriptions,
     * and builds a coherent, non-repetitive Lead + 3 logically connected Takeaways
     * (1 · Core -> 2 · Data -> 3 · Next).
     */
    function buildRichContentFromRss(title, rawDesc, source, categoryKey) {
      let cleanTitle = title.replace(/\s+[-–—|]\s+[^-–—|]+$/, "").trim();

      let rawText = cleanHtmlText(rawDesc)
        .replace(source, "")
        .replace(/View Full Coverage on Google News/gi, "")
        .trim();

      const titleWords = new Set(
        cleanTitle
          .toLowerCase()
          .replace(/[^a-z0-9\s]/g, "")
          .split(/\s+/)
          .filter(w => w.length > 3)
      );

      const candidateSentences = rawText
        .split(/(?<=[.!?])\s+|\s+[·•—-]\s+/)
        .map(s => s.replace(/^[\s\-–—·:]+/, "").trim())
        .filter(s => {
          if (s.length < 28) return false;
          if (s.toLowerCase() === cleanTitle.toLowerCase()) return false;
          const words = s.toLowerCase().replace(/[^a-z0-9\s]/g, "").split(/\s+/).filter(w => w.length > 3);
          if (words.length === 0) return false;
          const overlap = words.filter(w => titleWords.has(w)).length / words.length;
          return overlap < 0.65;
        });

      const numbersMatch = cleanTitle.match(/\b(\d+(?:[.,]\d+)?(?:\s*%|\s*billion|\s*million|\s*MW|\s*GW|\s*nm|\s*km|\s*B|\s*T|\s*x)?)\b/gi) || [];
      const keyMetric = numbersMatch.length > 0 ? numbersMatch.slice(0, 2).join(", ") : null;

      const domainChains = {
        physics: {
          lead: "Experimental instrumentation and theoretical modeling continue to push measurement precision beyond standard baseline thresholds.",
          step1: "Laboratory teams isolated key interaction variables to suppress thermal and quantum background noise.",
          step2: keyMetric
            ? `Measurements centered on critical thresholds (${keyMetric}) validated via independent detector calibration.`
            : "Cross-checked against peer-reviewed simulation models and high-luminosity detector telemetry.",
          step3: "Refines boundary conditions for next-generation particle, fusion, and condensed-matter experiments."
        },
        ai: {
          lead: "Next-generation compute architectures are shifting focus from raw parameter scaling toward inference efficiency and verifiable reasoning.",
          step1: "Optimizes token routing and memory bandwidth to reduce latency across complex multi-step tasks.",
          step2: keyMetric
            ? `Quantitative evaluation highlights key performance metrics (${keyMetric}) under production workloads.`
            : "Demonstrates higher accuracy per watt compared to dense legacy foundation models.",
          step3: "Lowers deployment costs and enables reliable autonomous workflows across scientific and enterprise stacks."
        },
        tech: {
          lead: "Hardware and systems engineering roadmaps are adapting to tighter power envelopes and next-node manufacturing constraints.",
          step1: "Integrates updated silicon packaging and firmware orchestration to eliminate data-path bottlenecks.",
          step2: keyMetric
            ? `Engineering validation targets key operational figures (${keyMetric}) across commercial supply chains.`
            : "Verified across pilot production lines with focus on thermal stability and yield rates.",
          step3: "Accelerates hardware adoption cycles for cloud infrastructure and edge computing platforms."
        },
        science: {
          lead: "Empirical laboratory findings are bridging molecular-scale mechanisms with macroscopic biological and material systems.",
          step1: "Researchers mapped the underlying causal pathway using high-resolution structural and genomic assays.",
          step2: keyMetric
            ? `Experimental trials recorded statistically significant indicators (${keyMetric}) across controlled cohorts.`
            : "Replicated across independent control groups with rigorous statistical confidence intervals.",
          step3: "Opens practical avenues for targeted clinical therapeutics and advanced materials synthesis."
        },
        space: {
          lead: "Orbital telemetry and deep-space instrumentation are expanding observational reach and launch cadence reliability.",
          step1: "Combines high-sensitivity spectroscopy and autonomous flight software to capture high-value mission data.",
          step2: keyMetric
            ? `Mission logs confirm key operational parameters (${keyMetric}) during active observation windows.`
            : "Calibrated against ground-station tracking arrays and multi-wavelength orbital sensors.",
          step3: "Informs upcoming planetary mission architectures and commercial orbital deployment schedules."
        },
        politics: {
          lead: "Diplomatic negotiations and regulatory frameworks are realigning around strategic technology supply chains and security.",
          step1: "Establishes formal inter-governmental working groups and binding compliance standards.",
          step2: keyMetric
            ? `Policy provisions address key jurisdictional thresholds (${keyMetric}) and cross-border trade rules.`
            : "Coordinates enforcement timelines across major ministerial and regulatory bodies.",
          step3: "Reshapes institutional compliance requirements and long-term cross-border investment flows."
        },
        economy: {
          lead: "Global capital markets and industrial supply chains are repricing long-term infrastructure, energy, and liquidity risks.",
          step1: "Institutional allocations are adjusting balance-sheet exposure in response to macroeconomic signals.",
          step2: keyMetric
            ? `Market data reflects key valuation and volume shifts (${keyMetric}) across primary sectors.`
            : "Tracked across sovereign bond yields, commodity futures, and quarterly industrial output.",
          step3: "Sets updated cost-of-capital benchmarks for corporate expansion and infrastructure financing."
        },
        motorsport: {
          lead: "Championship competitiveness increasingly hinges on real-time telemetry correlation, tire thermal windows, and aero balance.",
          step1: "Engineering crews refined chassis setup and hybrid energy deployment strategies for track-specific loads.",
          step2: keyMetric
            ? `Paddock data highlights key performance deltas (${keyMetric}) across stint simulations.`
            : "Validated through series technical scrutineering and simulator lap-time correlation.",
          step3: "Directly influences qualifying grid positions, pit-stop undercut windows, and championship standings."
        }
      };

      const chain = domainChains[categoryKey] || domainChains.tech;

      const summaryEn = candidateSentences.length > 0
        ? candidateSentences[0]
        : chain.lead;

      const step1En = candidateSentences.length > 1
        ? candidateSentences[1]
        : chain.step1;

      const factsEn = [

    async function enrichLiveArticlesWithOxygenAI(liveItems) {
      const subset = liveItems.slice(0, 4);
      for (const art of subset) {
        try {
          const prompt = [
            `Analyze this news headline: "${art.titleEn}" (Source: ${art.source}).`,
            `Return ONLY valid JSON with no markdown:`,
            `{"lead":"1 sentence of background context WITHOUT repeating words from the headline",`,
            `"t1":"1 short sentence on what specifically happened and mechanism",`,
            `"t2":"1 short sentence with key technical/factual specifics or numbers",`,
            `"t3":"1 short sentence on logical consequence or what is next"}`
          ].join(" ");

          const res = await fetchWithTimeout(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`, 5000);
          const text = await res.text();
          const start = text.indexOf("{");
          const end = text.lastIndexOf("}");
          if (start !== -1 && end > start) {
            const parsed = JSON.parse(text.slice(start, end + 1));
            if (parsed.lead && parsed.t1 && parsed.t2 && parsed.t3) {
              art.summaryEn = parsed.lead.trim();
              art.factsEn = [parsed.t1.trim(), parsed.t2.trim(), parsed.t3.trim()];
              art.summaryRu = "";
              art.factsRu = null;
              if (appState.translatedMap[art.id]) {
                await ensureArticleRussianTranslation(art);
              }
              renderEverything();
            }
          }
        } catch (e) {}
      }
    }

    async function fetchLiveNewsInBackground(isManual = false) {
      if (appState.category === "favorites") return;

      const refreshSvg = document.getElementById("refreshSvg");
      if (refreshSvg && isManual) refreshSvg.classList.add("spin-anim");

      const catKey = appState.category === "all" ? "all" : appState.category;
      const baseQuery = appState.searchQuery.trim()
        ? appState.searchQuery.trim()
        : CATEGORY_META[catKey]?.rssQuery || CATEGORY_META.all.rssQuery;

      const geoPart = REGION_META[appState.region]?.rssGeo
        ? ` (${REGION_META[appState.region].rssGeo})`
        : "";

      const fullQuery = `${baseQuery}${geoPart}`;
      const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(fullQuery)}&hl=en-US&gl=US&ceid=US:en`;

      const proxies = [
        {
          type: "rss2json",
          url: `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`
        },
        {
          type: "rawxml",
          url: `https://corsproxy.io/?${encodeURIComponent(rssUrl)}`
        },
        {
          type: "allorigins",
          url: `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`
        }
      ];

      let liveItems = [];

      for (const proxy of proxies) {
        try {
          const resp = await fetchWithTimeout(proxy.url, 3800);
          if (proxy.type === "rss2json") {
            const json = await resp.json();
            if (json && json.status === "ok" && Array.isArray(json.items) && json.items.length > 0) {
              liveItems = json.items.slice(0, 8).map((item, idx) => {
                const rawTitle = item.title || "Breaking Update";
                const sourceSplit = rawTitle.split(" - ");
                const sourceName = item.author || (sourceSplit.length > 1 ? sourceSplit[sourceSplit.length - 1] : "Global Wire");
                const { cleanTitle, summaryEn, factsEn } = buildRichContentFromRss(
                  rawTitle,
                  item.description || item.content || "",
                  sourceName,
                  catKey === "all" ? "tech" : catKey
                );
                return {
                  id: "live-" + btoa(encodeURIComponent(rawTitle)).slice(0, 12) + "-" + idx,
                  category: catKey === "all" ? detectCategoryFromText(cleanTitle) : catKey,
                  categoryLabel: (catKey === "all" ? detectCategoryFromText(cleanTitle) : catKey).toUpperCase(),
                  region: appState.region === "world" ? "world" : appState.region,
                  regionLabel: REGION_META[appState.region]?.labelRu || "Весь мир",
                  source: sourceName,
                  publishedAt: formatRssDate(item.pubDate),
                  link: item.link || "https://news.google.com",
                  titleEn: cleanTitle,
                  summaryEn: summaryEn,
                  factsEn: factsEn,
                  titleRu: "",
                  summaryRu: "",
                  factsRu: null,
                  aiAnalysisRu: ""
                };
              });
              break;
            }
          } else {
            let xmlText = "";
            if (proxy.type === "allorigins") {
              const data = await resp.json();
              xmlText = data.contents || "";
            } else {
              xmlText = await resp.text();
            }
            if (xmlText && xmlText.includes("<item>")) {
              const parser = new DOMParser();
              const xmlDoc = parser.parseFromString(xmlText, "text/xml");
              const nodes = Array.from(xmlDoc.querySelectorAll("item")).slice(0, 8);
              if (nodes.length > 0) {
                liveItems = nodes.map((node, idx) => {
                  const rawTitle = node.querySelector("title")?.textContent || "Breaking News";
                  const sourceNode = node.querySelector("source")?.textContent;
                  const sourceSplit = rawTitle.split(" - ");
                  const sourceName = sourceNode || (sourceSplit.length > 1 ? sourceSplit[sourceSplit.length - 1] : "World Press");
                  const rawDesc = node.querySelector("description")?.textContent || "";
                  const pubDate = node.querySelector("pubDate")?.textContent || "";
                  const link = node.querySelector("link")?.textContent || "https://news.google.com";
                  const { cleanTitle, summaryEn, factsEn } = buildRichContentFromRss(
                    rawTitle,
                    rawDesc,
                    sourceName,
                    catKey === "all" ? "tech" : catKey
                  );
                  return {
                    id: "live-xml-" + idx + "-" + Math.abs(hashCode(rawTitle)),
                    category: catKey === "all" ? detectCategoryFromText(cleanTitle) : catKey,
                    categoryLabel: (catKey === "all" ? detectCategoryFromText(cleanTitle) : catKey).toUpperCase(),
                    region: appState.region === "world" ? "world" : appState.region,
                    regionLabel: REGION_META[appState.region]?.labelRu || "Весь мир",
                    source: sourceName,
                    publishedAt: formatRssDate(pubDate),
                    link: link,
                    titleEn: cleanTitle,
                    summaryEn: summaryEn,
                    factsEn: factsEn,
                    titleRu: "",
                    summaryRu: "",
                    factsRu: null,
                    aiAnalysisRu: ""
                  };
                });
                break;
              }
            }
          }
        } catch (e) {}
      }

      if (liveItems.length > 0) {
        const existingTitles = new Set(CURATED_ARTICLES.map(a => a.titleEn.toLowerCase()));
        const uniqueLive = liveItems.filter(item => !existingTitles.has(item.titleEn.toLowerCase()));
        appState.articles = [...uniqueLive, ...CURATED_ARTICLES];
        renderEverything();
        updateTimestampText("Live RSS + OXY.GEN");
        if (isManual) showToast("Лента синхронизирована с мировыми источниками");
        enrichLiveArticlesWithOxygenAI(uniqueLive);
      } else {
        updateTimestampText("автономный буфер OXY.GEN");
        if (isManual) {
          renderEverything();
          showToast("Актуальная база OXY.GEN обновлена");
        }
      }

      if (refreshSvg) refreshSvg.classList.remove("spin-anim");
    }

    function detectCategoryFromText(text) {
      const t = text.toLowerCase();
      if (t.includes("quantum") || t.includes("cern") || t.includes("physics") || t.includes("collider") || t.includes("fusion")) return "physics";
      if (t.includes("ai") || t.includes("neural") || t.includes("model") || t.includes("llm") || t.includes("openai")) return "ai";
      if (t.includes("nasa") || t.includes("space") || t.includes("orbit") || t.includes("telescope")) return "space";
      if (t.includes("fia") || t.includes("formula") || t.includes("le mans") || t.includes("porsche") || t.includes("racing")) return "motorsport";
      if (t.includes("market") || t.includes("economy") || t.includes("fund") || t.includes("bank")) return "economy";
      if (t.includes("summit") || t.includes("minister") || t.includes("policy") || t.includes("eu")) return "politics";
      if (t.includes("gene") || t.includes("rna") || t.includes("biology") || t.includes("nature")) return "science";
      return "tech";
    }

    function hashCode(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) {
        h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
      }
      return h;
    }

    function formatRssDate(dateStr) {
      if (!dateStr) return "Сегодня";
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return "Сегодня";
        return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" }) + " · " +
               d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
      } catch (e) {
        return "Сегодня";
      }
    }

    /********************************************************************
     * 5. FILTERING, RENDERING & OXY.GEN BRIEFING
     ********************************************************************/
    function getFilteredArticles() {
      if (appState.category === "favorites") {
        return appState.favorites.filter(art => matchesSearch(art));
      }

      let list = appState.articles.filter(art => {
        const catMatch = appState.category === "all" || art.category === appState.category;
        const regMatch = appState.region === "world" || art.region === appState.region || art.region === "world";
        return catMatch && regMatch && matchesSearch(art);
      });

      if (list.length === 0 && appState.region !== "world") {
        list = appState.articles.filter(art => {
          const catMatch = appState.category === "all" || art.category === appState.category;
          return catMatch && matchesSearch(art);
        });
      }

      return list;
    }

    function matchesSearch(art) {
      const q = appState.searchQuery.trim().toLowerCase();
      if (!q) return true;
      const hay = [
        art.titleEn,
        art.summaryEn,
        art.titleRu || "",
        art.summaryRu || "",
        art.source,
        art.categoryLabel,
        ...(art.factsEn || []),
        ...(art.factsRu || [])
      ].join(" ").toLowerCase();
      return hay.includes(q);
    }

    /********************************************************************
     * 6. RELIABLE SINGLE-ARTICLE & FULL-PAGE TRANSLATION (EN ⇄ RU)
     ********************************************************************/
    async function translateTextGtx(textEn) {
      if (!textEn) return "";
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=${encodeURIComponent(textEn)}`;
      const res = await fetchWithTimeout(url, 4000);
      const data = await res.json();
      if (Array.isArray(data) && Array.isArray(data[0])) {
        return data[0].map(seg => seg[0]).join("");
      }
      throw new Error("Translation parse error");
    }

    async function ensureArticleRussianTranslation(art) {
      if (art.titleRu && art.summaryRu && Array.isArray(art.factsRu) && art.factsRu.length > 0) {
        return;
      }

      try {
        const combinedFacts = (art.factsEn || []).join(" ||| ");
        const [tRu, sRu, fRu] = await Promise.all([
          translateTextGtx(art.titleEn),
          translateTextGtx(art.summaryEn),
          translateTextGtx(combinedFacts)
        ]);
        art.titleRu = tRu || art.titleEn;
        art.summaryRu = sRu || art.summaryEn;
        art.factsRu = fRu ? fRu.split(/\s*\|\|\|\s*/) : art.factsEn;
      } catch (err) {
        art.titleRu = art.titleRu || art.titleEn;
        art.summaryRu = art.summaryRu || art.summaryEn;
        art.factsRu = art.factsRu || art.factsEn;
      }
    }

    async function toggleSingleArticleTranslation(articleId) {
      const art = appState.articles.find(a => a.id === articleId) ||
                  appState.favorites.find(a => a.id === articleId);
      if (!art) return;

      if (appState.translatedMap[articleId]) {
        appState.translatedMap[articleId] = false;
        renderEverything();
        return;
      }

      const btn = document.getElementById(`transbtn-${articleId}`);
      if (btn) {
        btn.textContent = "Перевод...";
        btn.classList.add("active-white");
      }

      await ensureArticleRussianTranslation(art);
      appState.translatedMap[articleId] = true;
      renderEverything();
    }

    async function toggleAllArticlesLanguage() {
      const filtered = getFilteredArticles();
      appState.allTranslatedRu = !appState.allTranslatedRu;

      const btn = document.getElementById("translateAllPageBtn");
      if (btn) {
        btn.textContent = appState.allTranslatedRu ? "Переключить все на EN" : "Перевести все на RU";

      if (!appState.allTranslatedRu) {
        filtered.forEach(a => { appState.translatedMap[a.id] = false; });
        appState.briefIsRu = false;
        renderEverything();
        showToast("Отображается английский оригинал (EN)");
        return;
      }

      showToast("OXY.GEN переводит ленту на русский...");
      await Promise.all(filtered.map(a => ensureArticleRussianTranslation(a)));
      filtered.forEach(a => { appState.translatedMap[a.id] = true; });

      renderEverything();
      showToast("Все статьи переведены на русский язык");
    }

    async function toggleAiDeepDive(articleId) {
      const art = appState.articles.find(a => a.id === articleId) ||
                  appState.favorites.find(a => a.id === articleId);

      appState.aiExpandedMap[articleId] = true;
      renderEverything();

        const textNode = document.getElementById(`aitext-${articleId}`);
        if (textNode) textNode.textContent = "OXY.GEN синтезирует аналитический разбор...";
        try {
          const prompt = `Кратко в 2 предложениях на русском языке объясни научную или рыночную значимость новости: ${art.titleEn}. ${art.summaryEn}`;
          const res = await fetchWithTimeout(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`, 4500);
          const text = await res.text();
          if (text && text.trim().length > 20) {
            art.aiAnalysisRu = text.trim();
          }
        } catch (e) {
          art.aiAnalysisRu = `Вывод OXY.GEN: Событие («${art.titleRu || art.titleEn}») формирует долгосрочный тренд в секторе ${art.categoryLabel} и подтверждается независимыми источниками (${art.source}).`;
        }
        renderEverything();
      }
    }

    /********************************************************************

     ********************************************************************/
    function toggleFavoriteArticle(articleId) {
      const art = appState.articles.find(a => a.id === articleId) ||
                  appState.favorites.find(a => a.id === articleId);
      if (!art) return;

      const idx = appState.favorites.findIndex(f => f.id === art.id || f.titleEn === art.titleEn);

        appState.favorites.splice(idx, 1);

        appState.favorites.unshift({ ...art });
        showToast("★ Сохранено в Избранное");
      }

      try {
        localStorage.setItem("oxynews_saved_v3", JSON.stringify(appState.favorites));
      } catch (e) {}

      updateFavoritesBadge();
      renderEverything();
    }

    /********************************************************************
     * 9. NAVIGATION, SEARCH & UTILITIES
     ********************************************************************/
    function selectCategory(catKey) {
      appState.category = catKey;
      document.querySelectorAll("#categoryBar .oxy-pill").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-cat") === catKey);
      });
      renderEverything();
      if (catKey !== "favorites") {
        fetchLiveNewsInBackground(false);
      }
    }

    function selectRegion(regKey) {
      appState.region = regKey;
      document.querySelectorAll("#regionBar .oxy-pill").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-reg") === regKey);
      });
      renderEverything();
      fetchLiveNewsInBackground(false);
    }

    let searchDebounceTimer = null;
    function handleSearchInput() {
      const val = document.getElementById("searchInput").value;
      appState.searchQuery = val;
      document.getElementById("clearSearchBtn").classList.toggle("hidden", !val.trim());
      renderEverything();

      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        if (val.trim().length >= 3) {
          fetchLiveNewsInBackground(false);
        }
      }, 650);
    }

    function triggerLiveSearch() {
      fetchLiveNewsInBackground(true);
    }

    function clearSearchInput() {
      document.getElementById("searchInput").value = "";
      appState.searchQuery = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");
      renderEverything();
    }

    function resetAllFilters() {
      appState.category = "all";
      appState.region = "world";
      appState.searchQuery = "";
      document.getElementById("searchInput").value = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");
      document.querySelectorAll("#categoryBar .oxy-pill").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-cat") === "all");
      });
      document.querySelectorAll("#regionBar .oxy-pill").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-reg") === "world");
      });
      renderEverything();
    }

    function manualRefresh() {
      fetchLiveNewsInBackground(true);
    }

    function pluralizeNews(n) {
      const mod10 = n % 10;
      const mod100 = n % 100;
      if (mod10 === 1 && mod100 !== 11) return "новость";
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return "новости";
      return "новостей";
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      if (!str) return "";
      return String(str).replace(/['"<>]/g, "");
    }

    let toastTimeout = null;
    function showToast(msg) {
      const t = document.getElementById("oxyToast");
      if (!t) return;
      t.textContent = msg;
      t.classList.remove("opacity-0");
      t.classList.add("opacity-100");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        t.classList.remove("opacity-100");
        t.classList.add("opacity-0");
      }, 2200);
    }

    function downloadSelfHtml() {
      const fullHtml = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([fullHtml], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "index.html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("Файл index.html сохранен");
    }
  </script>
